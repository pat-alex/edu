<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل استراتيجيات التدريس</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#101318);--surface:light-dark(#fff,#171b22);--surface2:light-dark(#f0f3f8,#202631);--text:light-dark(#172033,#f2f5f9);--muted:light-dark(#667085,#aab4c2);--border:light-dark(#dfe4ec,#303846);--accent:light-dark(#315efb,#7b9aff);--accent2:light-dark(#e9efff,#273554);--shadow:0 12px 30px rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}header{padding:34px 5vw 28px;background:linear-gradient(135deg,var(--surface),var(--surface2));border-bottom:1px solid var(--border)}.wrap{max-width:1250px;margin:auto}h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px)}.lead{margin:0;color:var(--muted);font-size:17px;line-height:1.8}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.stat{background:var(--surface);border:1px solid var(--border);padding:10px 15px;border-radius:14px}main{max-width:1250px;margin:auto;padding:24px 5vw 60px}.toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:12px 0}.search{width:100%;padding:15px 18px;border:1px solid var(--border);border-radius:15px;background:var(--surface);color:var(--text);font-size:16px;outline:none}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}select{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:19px;box-shadow:var(--shadow);cursor:pointer;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px);border-color:var(--accent)}.num{font-size:12px;color:var(--muted)}h2{font-size:20px;margin:7px 0 10px;line-height:1.5}.excerpt{color:var(--muted);line-height:1.75;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--accent2);color:var(--text)}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px}.close{float:left;border:0;background:var(--surface2);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}.detail{line-height:2;font-size:16px;white-space:pre-line}.section{border-top:1px solid var(--border);margin-top:20px;padding-top:16px}@media(max-width:700px){.filters{grid-template-columns:1fr}main{padding-inline:4vw}header{padding-inline:4vw}}
</style></head><body><div id="app"><header><div class="wrap"><h1>دليل استراتيجيات التدريس</h1><p class="lead">مكتبة تفاعلية لاستعراض الاستراتيجيات والبحث فيها وتصنيفها بأكثر من زاوية: نمط العمل، طريقة التفكير، والأدوات المستخدمة.</p><div class="stats"><div class="stat"><b>83</b> استراتيجية في المصدر</div><div class="stat">بحث فوري</div><div class="stat">تصنيفات متعددة</div></div></div></header><main><div class="toolbar"><input id="q" class="search" placeholder="ابحث باسم الاستراتيجية أو داخل محتواها…"><div class="filters"><select id="mode"><option value="">كل أنماط العمل</option><option>فردي</option><option>ثنائي</option><option>جماعي</option><option>مرن</option></select><select id="thinking"><option value="">كل طرق التفكير</option><option>تفكير إبداعي</option><option>تفكير نقدي</option><option>حل المشكلات</option><option>استقصاء واكتشاف</option><option>استدلال واستقراء</option><option>تواصل وحوار</option><option>تنظيم المعرفة</option><option>تذكر وفهم</option><option>فهم وتطبيق</option></select><select id="tool"><option value="">كل الأدوات</option><option>بطاقات</option><option>صور</option><option>فيديو</option><option>أوراق/ملاحظات</option><option>ألعاب</option><option>أدوات صفية</option><option>خرائط/مخططات</option><option>دمى/تمثيل</option><option>تقنية/عرض</option><option>لا تتطلب أداة محددة</option></select></div></div><div id="count" class="num" style="margin-top:15px"></div><section id="grid" class="grid"></section></main><div id="modal" class="modal"><article class="dialog"><button class="close" id="close">×</button><div id="detail"></div></article></div></div><script>const DATA=[{"id": 1, "title": "إستراتيجية لعبة التركيب", "content": "توزيع بطاقات على الطلبة في مجموعات بحيث كل بطاقة تكمل الأخرى وعلى كل مجموعة أن تبحث عن البطاقة المكملة لبطاقتها في لعبة التركيب. وهذا ممكن في التعاريف وغيرها.", "mode": ["جماعي"], "thinking": ["استقصاء واكتشاف"], "tools": ["بطاقات", "ألعاب"]}, {"id": 2, "title": "إستراتيجية رمي الكرة", "content": "في هذه الإستراتيجية يمكن أخذ الطلبة لفناء المدرسة ويطلب منهم الوقوف على شكل دائرة وعلى المعلم الوقوف داخل هذه الدائرة ومعه الكرة ثم يقوم برمي الكرة على أحد الطلبة وسؤاله سؤال متعلق بالدرس ؟ ومن ثم يرمي المعلم الكرة على طالب أخر وهكذا", "mode": ["مرن"], "thinking": ["فهم وتطبيق"], "tools": ["أدوات صفية"]}, {"id": 3, "title": "إستراتيجية التعلم بالتخيل", "content": "يؤدي استخدام إستراتيجية التعلم إلى إثارة مشاركة فاعلة بين الطلاب ، ويساعد على التعلم الإتقاني ، ويقود إلى اكتشاف أفكار جديدة ، ومن الشروط الواجب توفرها عند ممارسة التخيل في الصف ما يأتي ممارسة التخيل في مكان هادئ ، ومريح * توفير وقت كافٍ وملائم للتخيل توفير قائد للتخيل ، من أجل توجيههم خلاله. حرص الطالب على تفريغ ذهنه ، والتفكير في موضوع التخيل فقط توفير مؤثرات صوتية تلائم موضوع التخيل.", "mode": ["فردي"], "thinking": ["تفكير إبداعي", "استقصاء واكتشاف"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 4, "title": "إستراتيجية البحث عن النصف الآخر بالصور أو بالكلمات", "content": "في هذه الإستراتيجية أقوم بتوزيع بطاقات على الطلبة بحيث كل بطاقة تكمل الأخرى وعلى كل طالب أن يبحث عن البطاقة المكملة لبطاقته", "mode": ["فردي"], "thinking": ["استقصاء واكتشاف", "تذكر وفهم"], "tools": ["بطاقات", "صور"]}, {"id": 5, "title": "إستراتيجية البطاقات المروحية", "content": "هي إستراتيجية من استراتيجيات التعلم النشط ، والتي تعتمد على تقييم مستوى فهم الطالب للدرس ، وذلك بوضع مجموعة من الأسئلة في بطاقات يتم عرضها بشكل المروحة . خطوات إستراتيجية البطاقات المروحية : ١) يصمم المعلم بطاقة أسئلة عن الدروس السابقة أو الدرس الحالي أو يكلف الطلاب بإعدادها في وقت سابق. (٢ يقسم الطلاب إلى مجاميع صغير ( أربعة ) طلاب في كل مجموعة : الطالب الأول : يجعل البطاقات على شكل مروحة ويطلب من الطالب الثاني سحب بطاقة الطالب الثاني : يقرأ بصوت مرتفع السؤال على الطالب الثالث ويقول له أمامك خمس ثواني . الطالب الثالث : يجيب عن السؤال الطالب الرابع : يقيم الإجابة إن كانت صحيحة يثني على زميله ويشجعه ، وإن كانت خاطئة يدربه على الإجابة الصحيحة (۳) تكرر المهمة بين الطلاب في البطاقات الأخرى", "mode": ["ثنائي", "جماعي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["بطاقات", "تقنية/عرض"]}, {"id": 6, "title": "إستراتيجية العمل الجماعي", "content": "يعد المعلم هو المسؤول الأول عن نجاح عمل المجموعات ، ثم الأسرة ، ومن ، ومن أهداف العمل الجماعي ، التعلم النشط ، والاكتساب الاجتماعي الذي يعود عليهم أفراداً وجماعة ، وتتم هذه الإستراتيجية من خلال تقسيم الطلاب إلى عدة مجموعات صغيرة مكونة من ٤ أعضاء ، ثم إعطائهم واجبات معينة ومن مزايا هذه الإستراتيجية : أنها تكسب المتعلم كفاءة عملية تنمي روح المسؤولية لديه اتجاه مجتمعه ونفسه. تنمي روح التعاون * تعرف المعلم على حاجات التلاميذ . * تساعد على تبادل الأفكار فيما بينهم بالإضافة إلى أنها تزيد من تقبل أفكار الآخرين.", "mode": ["جماعي"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 7, "title": "إستراتيجية المبعوثون", "content": "المبعوثون هو نشاط يقوم فيه كل الطلبة ببحث ، ثم يخرج البعض لتدريسه بينما يتلقى الباقي الدرس ، يقوم المعلم بالتالي : تقسيم الفصل إلى مجموعات كل مجموعة تبحث في موضوع . شخص واحد من كل مجموعة يتجول في الغرفة ويشرح موضوع مجموعته للمجموعات الأخرى بعد أن يتم التدريس لكل المجموعات من قبل كل المبعوثين ، يعود المبعوثون إلى مجموعتهم الأصلية . هنا يتم إخبارهم بكل شيء تعلمته مجموعتهم الأصلية .", "mode": ["جماعي"], "thinking": ["استقصاء واكتشاف"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 8, "title": "إستراتيجية ساعي البريد", "content": "يقوم المعلم باختيار أحد الطلبة ليقوم بدور ساعي البريد ويحمل الحقيبة التي بها مجموعة من الأوراق مكتوب عليها بعض الأسئلة كرسائل لباقي الطلبة. يقوم الطالب (ساعي البريد) بتوزيع هذه الرسائل على الطلبة. يقوم كل طالب بقراءة رسالته وتنفيذ ما جاء بالرسالة. يتم التعليق علي إجابات الطلبة بعد انتهاء كل واحد منهم", "mode": ["جماعي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 9, "title": "إستراتيجية الأسئلة التي تستثير الهمم", "content": ". استخدم الأسئلة التي تستثير الهمم ليبذل الطلبة الأعلى قدرة جهداً كبيراً ، وفيما يلي بعض أنواع الأسئلة التي يمكنك الاعتماد عليها : أسئلة تقييم (احكم وقيم وانقد ودافع) أسئلة إبداع خطط ووحد وادمج واخلق) أسئلة مقارنة كيف يمكن مقارنتها ؟ كيف تختلف ؟ ماذا تشبه ولماذا ؟ ) أسئلة عميقة ( أسئلة فلسفية وسيناريوهات «ماذا لو » وأسئلة عن القيم ) . أسئلة بنمط أسئلة الاختبارات ؟", "mode": ["مرن"], "thinking": ["تفكير إبداعي", "تفكير نقدي", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 10, "title": "إستراتيجية بطاقات الفرز)", "content": "المعلومات بطاقات الفرز هو نشاط جيد لأنه يسمح للطلبة بفرز وترتيب ومطابقة . هو سهل التناول لأن المعلومات مرئية ويمكن معالجتها مادياً ، وقد يجد بعض الطلبة أن العمليات المعرفية الموازية يصعب مواكبتها إن لم يكن لديهم شيئاً ملموساً لدعمهم . يُنصح بعمل بطاقات فرز مقواة باستخدام قطعة من الكرتون في أعلى وأسفل جزء من البطاقة ، مما يجعلها أقل عرضة للتلف ويمكن استخدام نفس البطاقات عاماً بعد عام . EKOT THIS & HE Bowers Th", "mode": ["مرن"], "thinking": ["تنظيم المعرفة"], "tools": ["بطاقات", "تقنية/عرض"]}, {"id": 11, "title": "إستراتيجية ركن الخبراء ابحث عن طالب يشعر أنه خبير في موضوع يدرسونه . يطلب من هذا الطالب الجلوس في أحد أركان الغرفة ، ويتم إعطائه طاولة ومقعدين ( مقعد له والآخر للطلبة الذين يذهبون إليه ) . يُكلف الفصل بمهمة ، ويتم إبلاغهم بأن من لديه أي سؤال عليه التوجه إلى ركن الخبير للمساعدة . يمكنك تطوير النشاط بأن يكون لديك خبيرين أو ثلاثة خبراء في أماكن مختلفة من الغرفة", "content": "", "mode": ["جماعي"], "thinking": ["استقصاء واكتشاف"], "tools": ["أدوات صفية"]}, {"id": 12, "title": "إستراتيجية طرح الطلبة للأسئلة", "content": "يقوم المعلم بتشجيع طلابه على طرح الأسئلة وبذلك يحقق أكثر من فائدة مثل : يمكن للطلبة طرح الأسئلة بالشكل الذي يرتاحون له. يمكن للطلبة سماع أسئلة الآخرين. يمكن للطلبة ملاحظة كيفية إجابة المعلم على الأسئلة. يمكن للطلبة معرفة معلومات من ردود المعلم. يمكن للمعلم معرفة المجالات التي يرغب الطلبة في معرفتها.", "mode": ["فردي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 13, "title": "إستراتيجية أعطني السؤال", "content": "يقوم المعلم بكتابة إجابة سؤال ما ويطلب من الطلبة إعطاء السؤال المناسب لهذه الإجابة .", "mode": ["فردي"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 14, "title": "إستراتيجية الجلوس على المقعد الساخن", "content": "في هذه الإستراتيجية يقوم المعلم بوضع مقعد في مقدمة الفصل أمام طلابه ويقوم أحد الطلبة بالجلوس على هذا المقعد ويكون مستعدا للإجابة على أسئلة عن موضوع الدرس ، ويقوم باقى الطلبة بالتفكير في أسئلة يطرحونها على زميلهم ليجيب عليها ، وأيضاً يمكن أن يتبادل الطلاب الجلوس على المقعد الساخن", "mode": ["ثنائي", "جماعي"], "thinking": ["تواصل وحوار"], "tools": ["أدوات صفية"]}, {"id": 15, "title": "إستراتيجية حوض السمك", "content": "تُعد إستراتيجية حوض السمك من الاستراتيجيات التدريسية القائمة على التعلم النشط القائم على التدريب الجماعي ، وذلك من خلال ملاحظة الطالب ومتابعته مناقشة موضوع ما بين أعضاء المجموعات التي يلاحظها الطالب، ومدى تأثير ذلك على سلوكيات ونواتج أعضاء المجموعات. كيفية تنفيذ إستراتيجية حوض السمك تقوم هذه الإستراتيجية على ترتيب أربع أو خمسة مقاعد في دائرة مغلقة تمثل شكل حوض السمك ، وباقي المقاعد يتم ترتيبها على شكل دائرة خارج حوض السمك ، ويتم اختيار بعض من المشاركين لملء حوض السمك ، في حين يجلس بقية أفراد المجموعة على المقاعد خارج حوض السمك ، يناقش المشاركون في الدائرة الأولى التي تسمى حوض السمك موضوع ما ؛ في حين يجلس الطلاب الملاحظون في الدائرة الثانية خارج حوض السمك يستمعون ويسجلون ملاحظاتهم بصمت. وبعد ۱۰ - ۱۵ دقيقة يتبادل أعضاء الدائرتين أماكنهم ، وبعد ١٠ - ١٥ دقيقة أخرى يتجمع الطلاب جميعاً للتشارك فيما قاموا بملاحظته ويناقشوا المحتوى الذي قدم لهم في التدريب", "mode": ["جماعي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 16, "title": "إستراتيجية تدريس الطلبة ) تبادل الأدوار بين المعلم والطالب", "content": "في هذه الإستراتيجية يخلق المعلم فرصة لطلابه بتولي التدريس ، ومن طرق تنفيذ تلك الإستراتيجية : - أن يطلب المعلم من مجموعة من طلابه تحضير وإعداد عرض تقديمى لدرس ما أو جزء منه ، ثم عرضه على الفصل بالكامل داخل الحصة ومناقشتهم فيه. ١- أن يسأل المعلم طلابه من الذي لديه خبرة عن موضوع الدرس ، ومن ثم يختار . أحدهم ليقوم بشرح الدرس لباقي زملائه في الفصل ٣- أن يطلب المعلم من أحد طلابه بعد شرحه لجزء من الدرس أن يعيد هذا الشرح مرة أخرى.", "mode": ["جماعي"], "thinking": ["فهم وتطبيق"], "tools": ["تقنية/عرض"]}, {"id": 17, "title": "إستراتيجية حائط العجائب", "content": "خلق مساحة على حائط فصلك تُسمى « حائط العجائب » وإذا أردت أن يبدو أسئلة وكأنه جداراً يمكنك رسم طوب بالطباشير على ورق أسود . عندما يفكر الطلبة في ولا يوجد ما يكفي من الوقت لاستكشاف ذلك ، أطلب منهم كتابتها على قصاصات ملاحظات لاصقة ولصقها على حائط العجائب . عندما ينتهي الطلبة من المهام التي وضعتها في الدرس ، أطلب منهم جلب سؤال من « حائط العجائب » ودراسته إما مع زميل أو بالكتابة", "mode": ["ثنائي"], "thinking": ["تواصل وحوار"], "tools": ["أوراق/ملاحظات", "أدوات صفية"]}, {"id": 18, "title": "إستراتيجية العمل في ثنائيات", "content": "العمل في ثنائيات يسمح للطلبة بمناقشة سؤال أو مهمة ، وهذا يساعدهم لتنمية فهمهم قد ترغب في تكوين ثنائيات من طالب أقوى وآخر أضعف حتى يتمكن الأول من مساعدة الأخير لتناول ما يجدوه صعباً على كل واحد منهما بمفرده بدلاً من ذلك ، قد ترغب في تكوين ثنائي من طالبين ضعفاء بحيث يمكنك العمل معهما بنفسك ، وهذا سيسمح لك بمساعدة كلاهما لإحراز تقدم جيد", "mode": ["فردي", "ثنائي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 19, "title": "إستراتيجية الإيقاف المؤقت والتشغيل (عرض) فيلم قصير", "content": "يتم عرض فيلم قصير وطرح بعض الأسئلة للتوصل إلى موضوع الدرس ؛ حيث تختلف مشاهدة مقطع فيديو لأغراض أكاديمية عن مشاهدة مقطع فيديو بغرض الترفيه فان مجرد الضغط على زر التشغيل لا يضمن استفادة الطلاب على مستوى الاستيعاب أو التعلم ؛ حيث يجب أن يطبق الطلاب استراتيجيات الفهم من اجل استيعاب محتوى المادة المعروضة أمامهم ، بنفس الطريقة التي يتعاملون بها مع النصوص المكتوبة وتعمل إستراتيجية “ الإيقاف المؤقت والتشغيل “ كما يشير اسمها ؛ حيث يتم استخدام أسلوب الإيقاف المؤقت والتشغيل عند مشاركة مقطع فيديو مع الطلاب . تهدف هذه الإستراتيجية البسيطة والفعالة إلى توجيه الطلاب للتركيز على فهم المحتوى المعروض في مقطع الفيديو ؛ حيث توفر لهم فرصا متعددة لتنظيم مدخلات الفهم ومراقبتها قبل الاشتراك في المناقشات واستخلاص الحقائق من محتوى المادة المعروضة .", "mode": ["مرن"], "thinking": ["تواصل وحوار"], "tools": ["فيديو", "تقنية/عرض"]}, {"id": 20, "title": "إستراتيجية الخبرات (الشخصية", "content": "هناك ثلاث طرق حيث يمكنك استخدام الخبرات الشخصية للطلبة لمساعدتهم على التعلم : ١ - بناء المهام والأسئلة في دروسك والتي تتطلب من الطلبة استدعاء خبراتهم الخاصة . ۲ - شرح كيفية ربط الموضوعات التي تغطيها في درسك بخبرات الناس اليومية - حاول معرفة المزيد عن خبرات تلاميذك ، واستعن بها أثناء تدريسك إن أمكن فقد تستخدمها من أجل توضيح أكثر لبعض النقاط وربطها بشكل أكبر بطلبتك.", "mode": ["فردي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 21, "title": "إستراتيجية عرض صورة مرتبطة بالدرس", "content": "يقوم المعلم بعرض صورة معينة على الطلبة ويتم إعطاء الطلبة دقيقتين للتدقيق في الصورة ثم يتم سحب الصورة وطرح أسئلة دقيقة جداً عن الصورة", "mode": ["فردي"], "thinking": ["تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "تقنية/عرض"]}, {"id": 22, "title": "إستراتيجية تخيل النهاية", "content": "يتم قراءة قصة قصيرة للطلبة أو موقف وعلى الطلبة إغلاق أعينهم لمدة دقيقة وتخيل نهاية هذه القصة", "mode": ["فردي"], "thinking": ["تفكير إبداعي"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 23, "title": "إستراتيجية الصور", "content": "الصور المرتبطة بالكلمات المستخدمة تساعد الطلبة في فهم العمل . ستلاحظ ذلك في هذا العرض التقديمي حيث يوجد صورة على كل شريحة ترتبط بالإستراتيجية أو الأسلوب قم بالتمييز بتضمين صورة ذات صلة بكل مصدر تصنعه استخدم متصفح صور جوجل للعثور على صور بسرعة . ميزة إضافية للصور هي الحد من كمية النص التي يمكنك تضمينها ( الكثير من النصوص عادة يضر ) .", "mode": ["فردي"], "thinking": ["تذكر وفهم"], "tools": ["صور", "تقنية/عرض"]}, {"id": 24, "title": "إستراتيجية أعواد المثلجات", "content": "تستخدم هذه الإستراتيجية في تشجع جميع الطلاب على الاستماع الفعال والمشاركة الفعالة في مناقشات الفصل . وطريقة أعواد المثلجات مناسبة بشكل خاص عندما تستخدم في الأسئلة المفتوحة ، حيث يركز الطلاب انتباههم ليتشاركوا الأفكار مع زملائهم الآخرين حول الدرس خطوات الإستراتيجية : ۱ - يكتب اسم كل طالب على أعواد المثلجات ( ايس كريم ) . ۲- ضع الأعواد في علبة في مقدمة الفصل اخبرهم بالطريقة وكيف تتم ؟ ٤ - عند عقد مناقشة مع الطلاب وتوجيه سؤال لهم اسحب بشكل عشوائي وهم يشاهدونك تسحب أحد الأعواد واطلب من الطالب الذي يوجد عليه اسمه أن يجيب على هذا السؤال. ٥- يعود المعلم مرة أخرى للشرح أو للدرس ، بعد أن يرجع العود إلى العلبة مرة أخرى ، والسبب في ذلك حتى يدرك الطالب أنه من الممكن أن يوجه له السؤال مرة أخرى", "mode": ["جماعي"], "thinking": ["تواصل وحوار"], "tools": ["أدوات صفية"]}, {"id": 25, "title": "إستراتيجية المتضادات", "content": "المتضادات هي كلمات عكس بعضها : مضاد كلمة كبير : صغير V مضاد كلمة أبيض : أسود مضاد كلمة سريع : بطيء . عند تقديم كلمات جديدة للطلبة، تحدث معهم عن المتضادات لهذه الكلمات هذا سيساعد الطلبة على فهم الكلمات الجديدة ، سيجعل ما لا تعنيه الكلمة واضح ( وبالتالي ما تعنيه ) . إذا أمكن استخدم متضادات بسيطة يسهل على الطلبة التعرف عليها .", "mode": ["مرن"], "thinking": ["تذكر وفهم"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 26, "title": "إستراتيجية التقابل", "content": "اطلب من كل طالبان أن يقفا مقابل بعض لكن أحد الطالبان يقف مقابل السبورة ، ومن ثم كتابة كلمة على السبورة متعلقة بالدرس اطلب من الطالب الذي يقابل السبورة يوضح الكلمة أو تفسيرها من دون إعطاء الجواب مباشرة إلى الطالب الأخر وتحديد وقت من الزمن لذلك", "mode": ["ثنائي"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 27, "title": "إستراتيجية نمذجة (المحادثة", "content": "أشرك طالب في محادثة أمام كل الفصل ، قد يكون هذا جزءاً من مناقشة لكامل الفصل أو جزءاً من جلسة أسئلة وأجوبة استخدم محادثتك لنمذجة كيفية استخدام الكلمات الرئيسية أو المفردات التقنية أو الأفكار المتعلمة حديثاً قد تحب اختيار طالب تعرف مدى تمكنه من المادة التعليمية للحديث معه . بعد ذلك ، ابدأ مع الفصل مهمة مناقشة تتضمن استخدامهم لما قمت بنمذجته أياً كان", "mode": ["فردي", "جماعي"], "thinking": ["تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 28, "title": "إستراتيجية التمييز بالمخرجات", "content": "Cool@lea.com خطط لمهام يمكن تناولها بطرق مختلفة ، بحيث يمكن للطلبة التعامل مع المهام عند مستوى يشعرون عنده بقدرتهم على تناولها ) وبالتالي يشعرون بالسعادة عند القيام بها ) . هذه المهام سينتج منها التمييز بالمخرجات يمكن تلخيص هذا النموذج كالتالي : لے أعِد مهاماً يمكن لكل الطلبة القيام بها ، ولكنها مفتوحة بما فيه الكفاية لهم للقيام بها على أفضل ما يكون وفقاً لقدراتهم . المفتاح هنا هو تجنب المهام التي تتطلب استجابة محددة للغاية بحيث تترك مساحة في المهام للطلبة للمناورة", "mode": ["مرن"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 29, "title": "إستراتيجية المطابقة والتجميع والترتيب", "content": "المطابقة والتجميع والترتيب هي أنشطة جيدة لأنها في متناول جميع الطلبة. في الوقت نفسه ، فإنها تستدعي مستويات مختلفة من الفكر، فعلى سبيل المثال ، قد يكون هناك طالباً ذا قدرة عالية يستطيع تقديم حجة تفصيلية تشرح ترتيبه لمجموعة من العناصر، في حين أن الطالب ذو القدرة الأقل قد يختار بدلا من ذلك الإشارة إلى الخبرة والمقارنات . أنواع الأنشطة الثلاث تستدعي أيضاً تدقيق الأفكار والعناصر من خلال عملية محددة، وذلك لأن المطابقة والتجميع والترتيب إما أن تكون على مواد مادية مثل البطاقات أو تدوين الكلمات وإعادة ترتيبها.", "mode": ["جماعي"], "thinking": ["تنظيم المعرفة"], "tools": ["بطاقات"]}, {"id": 30, "title": "إستراتيجية الأنشطة المفتوحة", "content": "الأنشطة المفتوحة هي ذلك يتركها للطلبة لاتخاذ قرار بشأن كيفية تحقيقها ، وفيما يلي بعض الأمثلة : تلك التي يحدد المعلم فيها المبادئ التوجيهية ولكن بعد . » « هنا توجد قائمة بالأمور التي يجب عليك القيام بها ، والأمر متروك لك لكيفية قيامك بها ، والقاعدة الوحيدة هي أنك يجب أن تكون قادراً على عرض عملك علي اطرح على الطلبة سؤالاً أو عبارة واطلب منهم الرد عليه بطريقة يرونها مناسبة ( قد ترغب في طرح بعض الأفكار في حالة مواجهتهم مشكلة ) . أخبر الطلبة أين ينبغي أن يكونوا في نهاية الدرس ومن ثم اطلب منهم العمل على طريقتهم الخاصة للوصول إلى هناك ) سوف تحتاج إلى تقديم الدعم إلى الطلبة الأضعف ) .", "mode": ["مرن"], "thinking": ["حل المشكلات"], "tools": ["تقنية/عرض"]}, {"id": 31, "title": "إستراتيجية الحلقات الدائرية", "content": "تلخيص ما تم دراسته بصورة ثنائية في حلقة دائرية. ترتيب الطلبة في حلقة دائرية داخلية وحلقة دائري خارجية. كل طالبين متقابلين يتحدثان عن موضوع الدرس.", "mode": ["ثنائي"], "thinking": ["فهم وتطبيق"], "tools": ["صور"]}, {"id": 32, "title": "إستراتيجية ماذا يوجد داخل الصندوق", "content": "بوضع شيء متعلق بالدرس داخل الصندوق ويخمن الطلبة ماذا يوجد بداخله من خلال طرح الأسئلة", "mode": ["مرن"], "thinking": ["تواصل وحوار"], "tools": ["أدوات صفية"]}, {"id": 33, "title": "إستراتيجية مكعب الأسئلة", "content": "هي إستراتيجية مسلية تضفي جوا من المرح داخل الصف تقوم فكرتها على عرض موقف محفز للتفكير (نص أو قصة أو شريط مرئي)، ثم تطرح أسئلة باستخدام مكعب ،الأسئلة، هذه الأسئلة يراعى في تصميمها أن تكون مختلفة المستويات ومصنفة حسب تصنيف بلوم للأهداف المعرفية. خطوات إستراتيجية مكعب الأسئلة : ۱ -تقسيم الطلبة إلى مجموعات. ۲ - عرض مادة تحفز على التفكير. اكتشفي عندي ما رأيك ۳ -تحديد الأدوار على الفريق مثلا تقوم الطالبة رقم \"1\" المكعب، رقم \"۲\" يطرح السؤال مبتدئ بالكلمة برمي الموجودة على المكعب، رقم \" يجيب على السؤال، رقم ”“ يؤكد أو يصحح الإجابة. ٤ تحديد الأدوار ثم تبادلها في المرة الأخرى.", "mode": ["جماعي"], "thinking": ["تفكير إبداعي", "تواصل وحوار"], "tools": ["ألعاب", "تقنية/عرض"]}, {"id": 34, "title": "إستراتيجية بحث الزملاء", "content": "بحث الزملاء يعمل كما يلي : اعرض موضوع على الطلبة وضح أنهم سيبحثون وجهات نظر زملائهم وخبراتهم أنه وجدت أطلب منهم وضع مجموعة من الأسئلة يمكنهم طرحها عن الموضوع ، وقد من الأفضل أن يتراوح عددها بين ٥ و ۱۰ أسئلة حسب الوقت المتاح . أطلب من الطلبة إجراء مقابلة مع بعضهم البعض باستخدام أسئلتهم عند الانتهاء يجب على الطلبة تدوين نتائجهم. استراتيجيات التهيئة للدرس تحديد النقطة الأكثر أهمية في الدرس السابق وذلك بالطلب من كل طالبين أو ثلاثة المناقشة فيما بينهم وتحديد النقطة الأكثر أهمية في الدرس السابق وكتابتها في ورقة ومن ثم مناقشتها معهم من أجل بدء الدرس الجديد", "mode": ["جماعي"], "thinking": ["استقصاء واكتشاف", "تواصل وحوار"], "tools": ["أوراق/ملاحظات", "تقنية/عرض"]}, {"id": 35, "title": "إستراتيجية المجموعات الطنانة", "content": "المجموعات الطنانة هي ببساطة مجموعات صغيرة من طالبين أو ثلاثة طلبة شُكلت عشوائياً لمناقشة موضوع ما لفترة قصيرة . في الثنائيات يكاد يكون من المستحيل للطالب أن يبقى صامتاً وعندما يتحدث الطلبة \" على انفراد \" غالباً ما يمكنهم التحدث بعد ذلك \" علنا \" للمجموعة بأكملها المجموعات الطنانة مفيدة جداً لأداء العمل ، فصوت عشرة ثنائيات تطن يبعث طاقة أكثر بكثير مقارنة بشخص واحد يتحدث لمجموعة من عشرين شخصاً الطنين يمكنه ضبط الطلبة للاستماع إلى مادة موضوعك ويختتم أفكارهم ، فمثلاً : \" لتبدأ ، دعونا نطن لمدة خمس دقائق على ما هي ردود أفعالكم الأولية للقراءات التي وضعتها لندوة هذا الأسبوع ، فلتنطلقوا .", "mode": ["ثنائي", "جماعي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 36, "title": "إستراتيجية مثلث الاستماع", "content": "طريقتها : ١ - يقسم المعلم الطلبة إلى مجاميع كل مجموعة تتكون من ثلاثة طلاب. ٢ - كل طالب في كل مجموعة له دور محدد كما يلي : ألطالب الأول : متحدث ، يشرح الدرس أو الفكرة أو المفهوم ... الخ الطالب الثاني : مستمع جيد ، تطرح أسئلة على الطالب الأول لمزيد من التفصيل وتوضيح الفكرة الطالب الثالث : يرقب العملية وسير الحديث بين زميليه ويقدم تغذيه راجعه لهما . فهو يكتب ما يدور بين الطالبين الآخرين ويكون أشبه بالمرجع فعندما يحين دوره يقرأ من خلال مدوناته عن ما ذكره زميليه ، فيقول لقد ذكر ( أحمد ) كذا ، وذكر ( محمد ) كذا تبديل الأدوار بين الطلبة .", "mode": ["ثنائي", "جماعي"], "thinking": ["تواصل وحوار"], "tools": ["أدوات صفية"]}, {"id": 37, "title": "إستراتيجية العروض العملية", "content": "هي طريقة توضيحية لعرض حقيقة علمية باستخدام وسائل مناسبة هي كل ما يستخدمه المعلم من تجارب ووسائل ونماذج في تدريس العلوم ويقوم بعرضها على التلاميذ . ومن ذلك : تطبيق المعلم لمهارة الخط أو الوضوء أمام الطلاب . وتسمى (بالنمذجة) لأن المتعلم يلاحظ نماذج لما هو مراد منه تعلمه ويحاول محاكاتها. دور المعلم : القيام ببعض التطبيقات العملية والمهارات كالتشريح أو إعداد القطاعات أو التجارب وغيرها دور التلميذ : . المشاهدة والاستنتاج وربط النتائج بالشرح النظري ويطلب من بعض التلاميذ تكرار الأداء تحت إشرافه . مزايا العروض العلمية ( العملية ) : ١ - تتيح الفرصة للتلميذ بالقرب من المهارات وذلك عن طريق المشاهدة . ۲ - اقتصادية. يكفي جهاز واحد أو شريحة واحدة لمجموعة من التلاميذ . 1000: UPPER CIRCLE DRESS CIRCLE *********** - اقتصادية في الوقت مقارنة بالطريقة الاستكشافية . ٤- تشد انتباه التلاميذ للدرس ٥- تساعد المعلم على ضبط الفصل", "mode": ["جماعي"], "thinking": ["تفكير نقدي"], "tools": ["تقنية/عرض"]}, {"id": 38, "title": "إستراتيجية خطط الجلوس", "content": "استخدم خطط الجلوس للتمييز من خلال : وضع الطلبة ذوي القدرات المتفاوتة بجوار بعضهم البعض. وضع الطالب بجوار من تشعر أنه سيكون له تأثيراً إيجابياً عليه. إعداد الغرفة بحيث تجلس المجموعات التي تريدها في العمل الجماعي بجوار بعضهم البعض. وضع الطلبة ذوي مهارات معينة بجوار الطلبة الذين يحتاجون لتنمية تلك المهارات.", "mode": ["جماعي"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 39, "title": "إستراتيجية الحوار السقراطى", "content": "كان سقراط فيلسوفاً في اليونان القديمة ، وقد عرفنا عنه من خلال كتابات أفلاطون، وكان معتاداً على إشراك الناس في محادثة فلسفية ، وشمل ذلك تفنيد الحجج التي يقدمها الناس والمفاهيم والافتراضات التي تستند إليها الحوار السقراطي في الفصل يتضمن تحدث المعلم حديثاً مطولاً مع تلميذ عن أفكارهم بشأن موضوع ما . يجب أن يطرح المعلم الأسئلة ويقدم أمثلة مضادة ، والغرض من ذلك هو تحسين جودة حجج الطالب وتشجيعهم على النظر إلى أفكارهم بطريقة ناقدة القيام بهذا مع طالب أو طالبين بينما باقي الفصل يستمع هو أسلوب جيد للتمييز", "mode": ["جماعي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 40, "title": "إستراتيجية الخيارات", "content": "زود الطلبة بمجموعة من الخيارات بشأن كيفية تناولهم المهمة، على سبيل المثال : أعد للطلبة سؤالين يجب عليهم الإجابة عليها ثم زودهم بمجموعة من الخيارات للانتقاء منها : أكتب مقالة . أنشئ شريطاً كارتونياً إضافياً إصنع ملصقاً حائطياً يعلن عن إجابتك min madness أكتب قصيدة © (1) أعد مسرحية صغ خطاباً تقدم فيه وجهة نظرك أنشئ أغنية مستوحاة من أحد الأسئلة", "mode": ["جماعي"], "thinking": ["تفكير إبداعي", "تواصل وحوار"], "tools": ["أدوات صفية", "دمى/تمثيل"]}, {"id": 41, "title": "إستراتيجية الإضافات", "content": "أعد لنفسك أسئلة أو مهام إضافية جاهزة للتلاميذ الذين ينهون العمل الخيار المفضل لي هو أن يكون لدي أسئلة إضافية لجميع شرائح الباور بوينت medias الخاصة بي. بالإضافة لذلك فأنا أنشئ إضافات فائقة وإضافات مفرطة وحتى إضافات من الفضاء الخارجي للطلبة الذين ينهون ذلك استخدم مستويات أعلى من تصنيفات بلوم لخلق أسئلة ومهام إضافية خاصة بك يمكنك أيضاً اللجوء للفلسفة، ولاسيما عن طريق تشجيع الطلبة على تحليل المفاهيم .", "mode": ["مرن"], "thinking": ["تواصل وحوار"], "tools": ["تقنية/عرض"]}, {"id": 42, "title": "إستراتيجية الاستيضاح", "content": "اطرح على الطلبة أسئلة استيضاح شجعهم على القيام بالمثل معك الميزة الكبرى لاستيضاح الأسئلة هي أنها تقلل من الغموض، وهذا لأنها تتطلب من الشخص الذي يجري سؤاله شرح أحد جوانب الفكر أو الخطاب الخاص به بحيث يكون واضحاً للسائل تشمل أسئلة الاستيضاح : ماذا تعني بالضبط بذلك ؟ هل يمكنك إعطائي مثالاً ؟ كيف يعمل ذلك ؟ هل يمكنك شرح ذلك مرة أخرى ؟ بما تقارنها ؟", "mode": ["فردي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 43, "title": "إستراتيجية خليط المهام", "content": "وسيلة بديلة للحكم على ما إذا كان لديك خليط من المهام هو أن تنظر إلى ما تطلب من الطلبة إنتاجه هذا يشبه إلى حد ما العمل في الاتجاه العكسي. عند التخطيط لدرس أو وحدة عمل، حدد خليط من المنتجات ترغب من الطلبة إنجازها في النهاية اجعل هذه القائمة أساساً لأنشطتك ، فهي حتماً تُنتج خليطاً من الأنشطة، لأن الأنشطة سوف تتبع قائمة المنتجات المختلفة، فلن يكون لديك أي خيار سوى استخدام مجموعة من الأنشطة من أجل ضمان تحقيق تلك المنتجات", "mode": ["جماعي"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 44, "title": "إستراتيجية محطات الأنشطة", "content": "محطات الأنشطة تعمل كما يلي حدد عدداً من المحطات المختلفة في الغرفة يجب أن يكون لكل محطة موارد مختلفة و/أو مهام مرتبطة بها تأكد من توفر أنواع مختلفة من الموارد والمهام، مثلاً: قد يكون لديك دراسة حالة وحاسب محمول محمل عليه فيديو وبطاقات فرز وأوراق للتوزيع وشكل المعين ومقالة من صحيفة وزع الطلبة على المجموعات وحدد لكل مجموعة محطة . إجعل المجموعات تدور على المحطات بعد مرور الزمن المحدد، وتأكد من زيارة كل مجموعة لجميع المحطات", "mode": ["جماعي"], "thinking": ["فهم وتطبيق"], "tools": ["بطاقات", "فيديو", "تقنية/عرض"]}, {"id": 45, "title": "إستراتيجية الأنشطة التصاعدية", "content": "الأنشطة التصاعدية تأخذ الطلبة في رحلة تعلم تزداد صعوبة بالتدريج . خطط لدروسك لتشمل مهاماً يتزايد تعقيدها أو التي تتطلب تفكيراً متطوراً على نحو متزايد ليس من الضروري لجميع الطلبة الوصول إلى قمة السلم . شجعهم على الاستمرار في العمل صعوداً ، ولكن إذا وصل البعض إلى د وإنتاج أفكار وآراء إبداعية من الأفراد والمجموعات لحل مشكلة معينة، وتكون هذه الأفكار والآراء جيدة ومفيدة .. أي وضع الذهن في حالة من الإثارة والجاهزية للتفكير في كل الاتجاهات لتوليد أكبر قدر من الأفكار حول المشكلة أو الموضوع المطروح، بحيث يتاح للفرد جو من الحرية يسمح بظهور كل الآراء والأفكار. أهداف التدريس بطريقة العصف الذهني . ١ . تفعيل دور المتعلم في المواقف التعليمية . ۲ . تحفيز المتعلمين على توليد الأفكار الإبداعية حول موضوع معين من خلال البحث عن إجابات صحيحة، أو حلول ممكنة للقضايا التي تعرض عليهم . أن يعتاد الطلاب على احترام وتقدير آراء الآخرين ٤ . أن يعتاد الطلاب على الاستفادة من أفكار الآخرين من خلال تطويرها والبناء عليها خطوات جلسة العصف الذهني . * - تمر جلسة العصف الذهني بعدد من المراحل يجب توخي الدقة في أداء كل منها على الوجه المطلوب لضمان نجاحها وتتضمن هذه المراحل ما يلي : ١ - تحديد ومناقشة المشكلة ( الموضوع ) : قد يكون بعض المشاركين على علم تام بتفاصيل الموضوع في حين يكون لدى البعض الآخر فكرة بسيطة عنها وفي هذه الحالة المطلوب من قائد الجلسة هو مجرد إعطاء المشاركين الحد الأدنى من المعلومات عن الموضوع لأن إعطاء المزيد من التفاصيل قد يحد بصورة كبيرة من لوحة تفكيرهم ويحصره في مجالات ضيقة محددة . ٢ - إعادة صياغة الموضوع : يطلب من المشاركين في هذه المرحلة الخروج من نطاق الموضوع على النحو الذي عرف به وأن يحددوا أبعاده وجوانبه المختلفة من جديد فقد تكون للموضوع جوانب أخرى وليس المطلوب اقتراح حلول في هذه المرحلة وإنما إعادة صياغة الموضوع وذلك عن طريق طرح الأسئلة المتعلقة بالموضوع ويجب كتابة هذه الأسئلة في مكان واضح للجميع . ٣- تهيئة جو الإبداع والعصف الذهني : يحتاج المشاركون في جلسة العصف الذهني إلى تهيئتهم للجو الإبداعي وتستغرق عملية التهيئة حوالي خمس دقائق يتدرب المشاركون على الإجابة عن سؤال أو أكثر يلقيه قائد المشغل - العصف الذهني : يقوم قائد المشغل بكتابة السؤال أو الأسئلة التي وقع عليها الاختيار عن طريق إعادة صياغة الموضوع الذي تم التوصل إليه في المرحلة الثانية ويطلب من المشاركين تقديم أفكارهم بحرية على أن يقوم كاتب الملاحظات بتدوينها بسرعة على السبورة أو لوحة ورقية في مكان بارز للجميع مع ترقيم الأفكار حسب تسلسل ورودها، ويمكن للقائد بعد ذلك أن يدعو المشاركين ], "thinking": ["فهم وتطبيق"], "tools": ["أدوات صفية"]}, {"id": 49, "title": "إستراتيجية مسرح العرائس", "content": "ويقصد بها استخدام الدمى والعرائس في تمثيليات هادفة توفر للتلاميذ خبرات تعليمية ممتازة وهي شكل ممتع من أشكال التسلية والترويح على التلاميذ وخصوصاً للفصول الدنيا كما أنها طريقة مؤثرة في التعبير عن فكرة أو موضوع كما أنها وسيلة فعالة لمسرحة المواد الدراسية وهو يهتم بالطفل في المرحلة الابتدائية ، وبدأت الفكرة بمسرح الظل وذلك عن طريق : - ( قماشه بيضاء يقف وراءها أشخاص ويسلط ضوء على هذه القماش من الخلف فيظهر الظل معین ويعطى التعليمات ) أهداف مسرح العرائس : يعمل على تجسيد الشخصيات والأفكار بشكل ملموس ومسموع : ١. يساعد على إدراك الطلاب أن لهم دور في تغير واقعهم ٢. تمثل شخصية العروسة بالنسبة للطفل عالم خاص جدا . كما أن شكل العروسة جذاب للطفل وتثير انتباههم وتجعلهم يتواصلون مع العرض دون ملل ٤. يساعد المسرح على توصيل القيم والمبادئ السلوكية إيجابية للطلاب وتقديم الوسائل لتغير السلوكيات السلبية بطريقة غير مباشرة ه. يساعد التمثيل والمسرح على تثبيت المعلومة لدي للطلاب ٦. كما أن مسرح العرائس يساعد على تنمية الخيال لدى للطلاب ٧. يعمل التمثيل على تنمية القدرات الإبداعية والمواهب لدي الطلاب من خلال التمثيل ورواية القصة ٨. يساعد التمثيل الطلاب على تدريبهم على اكتساب مهارات التواصل والحديث والاتصال مع الآخرين ٩. يعمل مسرح العرائس على إثارة التفكير والرغبة للبحث في ما يقدم من خبرات متنوعة للطلاب والمحاور الأساسية التي نرتكز عليها عندما نقوم بعمل مسرحية للطلاب : ۱ . تحديد الهدف من المسرحية والوسائل المطلوب توصيلها ( تعليمية – سلوكية ) ٢. توزيع الأدوار على الطلاب وشرح شخصيات المسرحية . تحديد مكان المسرحية وتجهيزه بالإمكانيات المتاحة البسيطة ٤. تدريب الطلاب على تقمص دور الشخصية والتعبير عنها . ه . تدريب الطلاب على الربط بين الصوت والحركة ٦. مراعاة النظام أثناء عرض المسرحية", "mode": ["فردي"], "thinking": ["تفكير إبداعي", "استقصاء واكتشاف"], "tools": ["أدوات صفية", "دمى/تمثيل", "تقنية/عرض"]}, {"id": 50, "title": "إستراتيجية التعلم بالاكتشاف", "content": "ويمكن القول أن تعريفات مفاهيم الاكتشاف تتعدد فيما بينها إلا أننا يمكننا تقسيمها إلى ثلاثة أنواع النوع الأول : تعريفات اهتمت ب شاط، ويجب أن لا يلتفت أي طالب إلى زميله في أي وقت. .٢ الطالب الأول لديه محفز بصري والطالب الثاني لديه ورقة وقلم. ٣. يصف الطالب الأول الصورة للطالب الثاني الذي يرسم وصف زميلة بدقة من حيث الشكل ، الحجم ، التفاصيل ، الأحداث في الصورة أو العمليات الرئيسية، دون التركيز على جودة الرسم الفنية. ٤. يسأل الطالب الثاني أي سؤال حسب حاجته، أيضا المعلم قد يضبط الوقت بحيث يكون هناك زمن محدد. ه. يقارن الطلاب رسوماتهم بعد انتهاء الوقت. ٦. ثم قد يتبادل الطلاب الأدوار. . يقيم المعلم الأعمال ويركز على العمليات والمهارات التي حدثت مثل طرح الأسئلة ، واستخلاص الأفكار، الاتصال", "mode": ["فردي", "ثنائي"], "thinking": ["تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "أوراق/ملاحظات"]}, {"id": 53, "title": "إستراتيجية المسابقات", "content": "تكتسب المسابقات في مجال النشاط المدرسي أهمية خاصة ذلك لأن المسابقات شحذ للهمم واستنهاض لها ولون من ألوان تنمية القدرات وبناء الثقة بالنفس إذ تعطي المشاركة الفرصة لاختيار ما يوافق قدراته ويشبع ميوله ويواكب مداركه واستعداده الشخصي فتبرز مواهبه وتنمو مهاراته العقلية والعلمية ، وهي وسيلة مهمة من الوسائل التربوية المألوفة في خطط التربية والتعليم وذلك لما لوحظ من تحقيق أهداف كثيرة الأهداف العامة التي يمكن تحقيقها من خلال المسابقات ما يأتي : -١ - تعميق القيم الإسلامية في النفوس وتنمية جوانب الأخلاق الكريمة . ٢ - التشجيع على القراءة والاستنباط في ميادين العلم والمعرفة . - التوجيه إلى البحث العلمي ٤ - تنمية المواهب والقدرات الانتاجية -٥- إثراء المعلومات في الجوانب المختلفة ٦- بناء الثقة في النفس والتعود على ترتيب الأفكار وربطها بعضها ببعض ۷ - التدريب على عادة التعلم والدراسة وآداب الاستماع . !!! - إكساب قوة العزيمة وتحمل المسؤولية وحسن الاختيار ۹ - تعويد النشئ على استثمار أوقات الفراغ بما هو مفيد التخطيط للمسابقات الغير صفية : عند وضع خطة للمسابقات يجب مراعاة الآتي : -١ - تحديد الأهداف المراد تحقيقها . ۲ - وضع الأساليب الملائمة لتنفيذها والإشراف عليها التنوع في ألوان المسابقات مع مراعاة عنصر التشويق والابتكار . ٤ - تحديد وسائل تقويم المسابقات ه رصد ميزانية خاصة بالمسابقات ) تمويل مكافآت وجوائز المتسابقات ، وسائل التنفيذ .......... ٦- وجود عنصر المرونة وقابلية التعديل والتغيير في الخطة إذا لزم الأمر الإجراءات التنظيمية للمسابقات : ۱ - تشكل لجنة لتحكيم المسابقة من قبل المعلمات المختصات ۲- تحديد عناصر التقويم وتوزيع الدرجات في استمارة خاصة بالمسابقة - الإعلان المبكر عن المسابقة بمختلف الوسائل الممكنة بما يتيح مشاركة أكبر عدد ممكن من الطالبات ٤- تحديد وقت بداية المسابقة ونهايتها ، والالتزام التام بذلك حتى لا تفقد المسابقة أهميتها تحديد الجوائز التشجيعية لكل مسابقة والإعلان عنها ٦ - تقويم المسابقة من قبل لجنة من أعضاء مجلس النشاط لقياس مدى تحقيق الهدف منها أنواع المسابقات : . أولاً : مسابقات ثقافية وتشمل : ۱ - مسابقات دينية : (( حفظ القرآن الكريم (تلاوة وتجويد وتفسير) العقيدة والفقه الثقافة الاسلامية مصرح بها من قبل شئون تعليم البنات ) ۲ - مسابقات أدبية : (( المقال أدبية أخرى . )) السنة النبوية موضوعات في الأبحاث الدينية مسابقات في كتب وأشرطة إسلامية ) أخرى . )) الشعر القصة القصيرة الخطابة والإلقاء أبحاث أفضل -٣- مسابقات عامة : (( أسئلة ثقافية هادفة متنوعة أحسن صحيفة ، مجلة ، مطوية برنامج إذاعي أحسن تعليق أخرى . )) ثانياً : مسابقات اجتماعية وتشمل : (( أبحاث اجتماعية ( صحية ، بيئية ) مقالات اجتماعية ( صحية ——— بيئية ) أخرى . )) ثالثاً : مسابقات علمية وتشمل : (( أبحاث علمية - مبتكرات علمية - تجارب علمية أخرى . () رابعاً : مسابقات فنية وتشمل : (( المرسم المفتوح الموضوع الفني الواحد الأشغال الفنية المسابقات الحرة المشاركة في المناسبات التي تقرها شئون تعليم البنات --- أخرى . )) خامساً : مسابقات مهنية وتشمل : (( الإنتاج الواحد ) تقوم على أساس تحديد نوع من الإنتاج كالمفارش تنسيق الزهور ......... المسابقات الحرة ) تترك الحرية للطالبة في المشاركة بالإنتاج الذي ترغب فيه ) - المشاركة في المناسبات التي تقرها شئون تعليم البنات — — — - أخرى . ))", "mode": ["فردي"], "thinking": ["تفكير إبداعي", "استقصاء واكتشاف", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 54, "title": "إستراتيجية القبعات الست", "content": "هي تقسيم التفكير إلى ستة أنماط ، واعتبار كل نمط قبعة يلبسها الإنسان أو يخلعها حسب طريقة تفكيره في تلك اللحظة. ولتسهيل الأمر فقد أعطى لوناً مميزاً لكل قبعة لنستطيع تمييزه وحفظه بسهولة . وتُستخدم في طريقة تحليل تفكير المتحدثين أمامك بناءاً على نوع القبعة التي يرتدونها . أن هذه الطريقة تعطي الإنسان في وقت قصير قدرة كبيرة على أن يكون متفوقاً وناجحاً في المواقف العملية والشخصية ، وفي نطاق العمل أو نطاق المنزل ، وأنها تُحوّل المواقف السلبية إلى مواقف إيجابية ، والمواقف الجامدة إلى مواقف مبدعة ، إنها طريقة تعلمنا كيف ننسق العوامل المختلفة للوصول إلى الإبداع أهدافها : ۱- توضيح وتبسيط التفكير لتحقيق فعالية أكبر ٢ - التحول من عرضية التفكير إلى تعمد التفكير المرونة في تغيير التفكير من نمط إلى أخر مميزاتها : ۱ - سهلة التعلم والتعليم ۲- تستخدم على جميع المستويات ٣ - تغذي جانب التركيز والتفكير الفعال ٤ - تعترف بالمشاعر كجزء مهم للتفكير . ٥- يمارس فيها أنواع مختلفة من التفكير ، مثل التفكير الناقد والإبداعي والعاطفي . فكرة القبعات الست : هذه الإستراتيجية تفيدنا في تحديد مسار خطّي للتفكير من ) ست محطات ) ، يعالج الفرد أو المجموعة في كل محطة منها “ جانباً مُحدّداً \" من جوانب الموضوع . و تم التعبير عن كل محطة بقبّعة ، وكل قبعة تم تحديدها بلون معين .. والسبب في ذلك لأن القبعات تُرتدى على الرأس .. والرأس هو مكان للتفكير ! لا بد أن نلتزم بهذين الشرطين لنخرج بنتيجة إبداعية : ١ - المرور بالقبعات الست جميعها دون إغفال أي منهما ٢ - التركيز في كل قبعة على الجانب المحدد لها ، ومنع التداخل بين القبعات", "mode": ["فردي", "جماعي"], "thinking": ["تفكير إبداعي"], "tools": ["أدوات صفية", "تقنية/عرض"]}, {"id": 55, "title": "إستراتيجية التدريس الاستقرائي", "content": "هو تتبع الأمثلة أو الجزئيات وتفحصها للتعرف علـى وجـوه الشبه والخلاف للتوصل لتحديد القاعدة أو القانون أو التعريف . هو انتقال العقل من الحوادث الجزئية إلى القواعد و الأحكام الكلية التي تنظم الحوادث والحالات. الطريقة الاستقرائية : تبدأ من الأمثلة لتصل إلى القاعدة تبدأ بتعليم الجزئيات وتنتهي بالكليات تسمى الطريقة التركيبية : التركيب ) توحيد المعلومات الجزئية ذات العلاقة في (کلیات) مزايا الطريقة الاستقرائية : ۱. من الأيسر على الطالب البدء بالحالات الفردية البسيطة للانطلاق إلى القواعد ٢. الطالب بحاجة إلى الاستقراء في المرحلة الأولى من الدرس. بالاستقراء نصل مع الطالب إلى القاعدة . ٤. تبدأ من الأمثلة لتصل إلى القاعدة ه تعود الطالب الاعتماد على النفس والكشف عن حلول ما يعرض له ٦. أن العمل الذي يقوم به العقل يكسبه حدة ومرانا خطوات التدريس بطريقة الاستقراء : ١ . يقوم المعلم بتحضير الأمثلة وتسجيلها على السبورة أو عرضها بوسيلة من الوسائل المناسبة . ( قد تؤخذ الأمثلة من أفواه الطلاب ٢. يعمل المعلم على مناقشة الأمثلة مع الطلاب 5+3+4+2 ? classroomclipart.com http://classroomclipart.com . يتم صياغة القاعدة النهائية", "mode": ["فردي"], "thinking": ["استدلال واستقراء", "تواصل وحوار"], "tools": ["تقنية/عرض"]}, {"id": 56, "title": "إستراتيجية حل المشكلات", "content": "المشكلة بشكل عام معناها : حالة شك وحيرة وتردد تتطلب القيام بعمل بحث يرمي إلى التخلص منها وإلى الوصول إلى شعور بالارتياح، ويتم من خلال هذه الطريقة صياغة المقرر الدراسي كله في صورة مشكلات يتم دراستها بخطوات معينة. والمشكلة : هي حالة يشعر فيها التلاميذ بأنهم أمام موقف قد يكون مجرد سؤال يجهلون الإجابة عنه أو غير واثقين من الإجابة الصحيحة، وتختلف المشكلة من حيث طولها ومستوى الصعوبة وأساليب معالجتها ، ويطلق على طريقة حل المشكلات ) الأسلوب العلمي في التفكير ( لذلك فإنها تقوم على إثارة تفكير التلاميذ وإشعارهم بالقلق إزاء وجود مشكلة لا يستطيعون حلها بسهولة. ويتطلب إيجاد الحل المناسب لها قيام التلاميذ بالبحث لاستكشاف الحقائق التي توصل إلى الحل. على أنه يشترط أن تكون المشكلة المختارة للدراسة متميزة بما يلي : .١ أن تكون المشكلة مناسبة لمستوى التلاميذ ٢. أن تكون ذات صلة قوية بموضوع الدرس ، ومتصلة بحياة التلاميذ وخبراتهم السابقة . الابتعاد عن استخدام الطريقة الإلقائية في حل المشكلات إلا في أضيق الحدود. وعلى المدرس إرشاد وحث التلاميذ على المشكلة عن طريق : ۱- حث الطلاب على القراءة الحرة والاطلاع على مصادر المعرفة المختلفة من الكتب والمجلات وغير ذلك. - أن يعين التلاميذ على اختيار أو انتقاء المشكلة المناسبة وتحديدها وتوزيع المسؤوليات بينهم حسب ميولهم وقدراتهم. ٣- أن يقوم بتشجيع التلاميذ على الاستمرار ويحفزهم على النشاط في حالة تهاونهم، وتهيئ لهم المواقف التعليمية التي تعينهم على التفكير إلى أقصى درجة ممكنة ٤- لا بد أن يصاحب هذه الطريقة عملية تقويم مستمر من حيث مدى تحقق العرض والأهداف ومن حيث مدى تعديل سلوك التلاميذ وإكسابهم معلومات واهتمامات واتجاهات وقيم جديدة مرغوبة فيها. ( والمشكلات مثل : الانفجار السكاني، مشكلة الأمية ، البطالة ) وغيرها ولابد للمعلم من : - . ١- الإحساس بوجود مشكلة وتحديدها : ويكون دور المعلم في هذه الخطوة هو اختيار المشكلة التي تناسب مستوى نضج التلاميذ والمرتبطة بالمادة الدراسية. ۲۔ فرض الفروض : وهي التصورات التي يضعها التلاميذ بإرشاد المعلم لحل المشكلة وهي الخطوة الفعالة في التفكير وخطة الدراسة، وتتم نتيجة الملاحظة والتجريب والاطلاع على المراجع والمناقشة والأسئلة وغيرها. -۳- تحقيق الفروض : ومعناها تجريب الفروض واختيارها واحداً بعد الآخر، حتى يصل التلاميذ للحل، باختيار أقربها للمنطق والصحة أو الوصول إلى أحكام عامة مرتبطة بتلك المشكلة. ٤. الوصول إلى أحكام عامة ( التطبيق .) . أي تحقيق الحلول والأحكام التي تم التوصل إليها للتأكد من صحتها. ويمكن إيجاز الخطوات الرئيسة التي تسير فيها الدراسة في طريقة حل المشكلات بالآتي : مزايا وعيوب طريقة المشكلات : أولاً : المزايا : ١. تنمية اتجاه التفكير العلمي ومهاراته عند التلاميذ. ٢. تدريب التلاميذ على مواجهة المشكلات في الحياة الواقعية. ٣. تنمية روح العمل الجماعي وإقامة علاقات اجتماعية بين التلاميذ. .٤ أن طريقة حل المشكلات تثير اهتمام التلاميذ وتحفزهم لبذل الجهد الذي يؤدي إلى حل المشكلة. ثانياً : العيوب : .۱ صعوبة تحقيقها في كل المواقف التعليمية ٢. قلة المعلومات أو المادة العلمية التي يمكن أن يفهمها الطلاب عند استخدام هذه الطريقة 3. قد لا يوافق المعلم في اختيار المشكلة اختياراً حسنا ، وقد لا يستطيع تحديدها بشكل يتلاءم ونضج التلاميذ. ٤. تحتاج إلى الإمكانات وتتطلب معلماً مدرباً بكفاءة عالية.", "mode": ["جماعي"], "thinking": ["حل المشكلات", "استقصاء واكتشاف", "تواصل وحوار"], "tools": ["صور", "تقنية/عرض"]}, {"id": 57, "title": "إستراتيجية \" القصة", "content": "يؤكد الباحثون على الأهمية التربوية للقصة بالنسبة للطلبة ، موضحين أنها من الأساليب التربوية المؤثرة والفعالة في تربية الطلبة وتوجيههم ، لما لها من قوة تأثير على متلقيها من الطلبة ، وقد يكون تأثيرها إما سلبياً أو ايجابياً ، ذلك حسب نوعها والهدف منها ، كما للقصة دور في توجيه السلوك لدى الطلبة ، وغرس المبادئ الجيدة فيهم ، فهي تعلم الطلبة الآداب ، وتزرع الفضائل فيهم ، كما لها الدور الكبير في تنمية اللغة وتهذيبها ، وتقوي الخيال في أذهانهم ، كذلك تدخل البهجة والسرور فيهم تعريف القصة : هي فن من الفنون الأدبية التي عرفها الانسان منذ القدم وهي فن محبب إليهم على اختلاف اجناسهم وشعوبهم واعمارهم وقد احتلت في عصرنا الحريث مكانة مرموقة في مجال الأدب شروط عامة تراعى في القصة : ١ - أن تكون لغة القصة (مفرداتها) وتراكيبها (أسلوبها) مناسبين للغة التلميذ. ۲ - أن يكون مضمونها ومعناها مناسبين لمستوى التلميذ العقلي. ٣ ـ أن تكون طبيعية في بنائها بعيدة عن التكلف. ٤ - أن تكون مناسبة في طولها وقصرها لمستوى التلاميذ العقلي. ه - أن توحي للتلاميذ بتمثل أنماط سلوكية حميدة. ٦ - أن تلبي رغبات وميول وحاجات الأطفال في مراحل النمو المختلفة. فوائد تربوية يحققها قص القصة : لعل أهم الفوائد التربوية التي تحققها القصة للأطفال تتمثل في أنها : ١ - توفر للطفل المتعة والتسلية من خلال تتبعة للعلاقات بين أشخاصها ، ومن خلال تفاعله معها. ٢ - تنمي ثروة الطفل اللغوية، وتثري معجمة اللغوي بما تتضمنه من مفردات وتعابير وتراكيب لغوية، يمكن أن تضاف إلى خبراته اللغوية السابقة. ۳ - تربط الطفل بعادات وتقاليد وقيم المجتمع الذي يعيش فيه، وتوحي له باحترامها وعدم الخروج عنها، فتساعده بذلك على التكيف والتواؤم مع مجتمعه. ٤ - تطلع الطفل على عادات وتقاليد وقيم المجتمعات الإنسانية الأخرى مما يتيح له مجال المقارنة بين عادات المجتمعات المختلفة، فيفيد من الجوانب الإيجابية منها، ويتجنب السلبية. ٥ - تزود الطفل بالمعلومات والمعارف التي تضاف إلى خبراته عن طريق ما تحمله القصة من جديد في هذا الصدد. ٦ - تنمي خيال الأطفال وتتيح لهم تصور الأشياء والأحداث على نحو يريحهم ويمتد إلى الحدود الطبيعية لتصوراتهم ، التي تختلف باختلاف مراحل النمو الإدراكي التي يمرون بها. ۷ - تشجعهم على مواجهة زملائهم في مواقف تعبيرية طبيعية في المدرسة وخارجها والتحدث إليهم، ومجادلتهم وذلك حينما يقصون قصة، أو يعيدون قصص أخرى، أو يجيبون عن أسئلة حول القصة. - تنفس عن بعض العواطف والمشاعر المكبوتة في نفوس التلاميذ", "mode": ["فردي"], "thinking": ["تفكير إبداعي", "تفكير نقدي", "تواصل وحوار"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 58, "title": "إستراتيجية الألعاب والألغاز", "content": "يُعرّف اللعب بأنه نشاط موجه يقوم به الطالب لتنمية سلوكهم وقدراتهم العقلية والجسمية و الوجدانية ، ويحقق في نفس الوقت المتعة و التسلية ؛ وأ ث جمل صحيحة وجملة خاطئة، استنادًا إلى ما اخترته من مواد رقمية . اعرض الجمل الثلاث الصحيحة والجملة الخاطئة، واطلب إلى كل طالب أن يقول لزميله الجملة التي يعتقد في خطئها مع التعليل ٤. أخبر الطلاب أنهم سيشاهدون مقطع يكشف عن حقيقة الجمل التي عرضتها عليهم ، وأنهم سيحتاجون إلى دعم إجاباتهم بأدلة من المقطع المختار. ه. اعرض المقطع مع الإيقاف من حين لآخر ، للسماح للطلاب بتدوين ملاحظات ٦. عند انتهاء المقطع، اطلب إلى الطلاب العمل في ثنائيات أو في مجموعات صغيرة لمناقشة الجمل الصحيحة والخاطئة ، مع تقديم أدلة داعمة في كل حالة .", "mode": ["ثنائي", "جماعي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["فيديو", "أدوات صفية", "تقنية/عرض"]}, {"id": 67, "title": "إستراتيجية معركة كرات الثلج", "content": "فكرة كبيرة : يعد عرض مقاطع فيديو داخل الفصل وسيلة رائعة لتفعيل مشاركة الطلاب وإضفاء روح حية على تجربة التعلم . ولكن في اغلب الأحيان ، تتحول مشاهدة مقطع فيديو إلى تجربة تعلم سلبية غير تفاعلية . ولتحقيق أقصى استفادة من مشاهدة مقطع فيديو ، من المهم تفعيل مشاركة الطلاب من خلال إستراتيجية تحفيزهم على التفكير ، والتأمل ، ومشاركة ما تعلموه . ولذلك تمثل إستراتيجية هذا الأسبوع نسخه مرحة من لعبة معركة كرات الثلج ؛ حيث يشارك الطلاب ما تعلموه مع زملائهم المواد المستخدمة : مقطع فيديو ، ورق ، أوعية كتابة الخطوات : اطلب من كل طالب استخراج قطعة ورق فارغة اشرح للطلاب أنهم سيشاهدون مقطع فيديو ، وسيكون مطلوبا من كل منهم كتابة حقيقة واحدة تعلموها من المقطع اطلب من كل طالب تكوير ورقته في شكل كرة ، وعند العد حتى ٣ ، يقوم كل طالب بقذف “ كرات الثلج الخاصة به “ في الهواء . اطلب من كل طالب التقاط واحدة من كرات الثلج وفتحها وقراءة الحقيقة . يكون الطلاب عندها مسؤولين عن إضافة عبارة أخرى إلى الورقة ؛ ويمكن أن تكون تفصيلة تدعم العبارة الأصلية أو عبارة جديدة تمام مرتبطة بما تعلموه . اعد عملية كرات الثلج عدة مرات حتى تتاح للطلاب فرصة كافية لتحديد الأشياء المهمة التي تعلموها من المقطع . اختتم النشاط بمطالبة الطلاب بمشاركة المعلومات المكتوبة على كرات الثلج الخاصة بهم مع المجموعة بالكامل؛ حيث يوفر هذا النشاط وسيلة رائعة لتحفيز الطلاب على تذكر الموضوعات والمفاهيم الأساسية المستمدة من المواد التي تعلموها . أنها تجربة مرحة وتحفيزية أفكار إضافية : اطلب من الطلاب التقاط صور رقمية لعبارات كرات الثلج وإبداء رأيهم حول ما تعلموه في منشور مدونة . واطلب من الطلاب صياغة أسئلة عن المحتوى ، مع مطالبة كل منهم لزميل له بالإجابة عنها", "mode": ["ثنائي", "جماعي"], "thinking": ["تواصل وحوار"], "tools": ["فيديو", "أوراق/ملاحظات", "ألعاب", "أدوات صفية", "تقنية/عرض"]}, {"id": 68, "title": "إستراتيجية نصف", "content": "الصورة فكرة كبرى : ترتكز نظرية المعالجة النشطة ، من حيث الجوهر ، على مبدأ “ استخدامه أو افقده \" وهو ما للطلاب \"\" يعني ضرورة مشاركة الطلاب بنشاط فيما يتعلمون . ترتكز هذه الإستراتيجية على استخدام “ الدفاتر التفاعلية يوجد بهذه الدفاتر اتجاه \" إخراج \" على الجانب الأيسر و إدخال “ على الجانب الأيمن لمساعدة الطلاب على التسجيل وتنظيم ومعالجة المعلومات الجديدة بفاعلية . من خلال إكمال نصف الصورة ، يشارك الطلاب بنشاط في تعلمهم ، وتتاح لهم فرصة لتبادل ما تعلموه في “ الدفاتر التفاعلية للطلاب\" المواد : مقطع فيديو ( ٢-٥ دقائق ) ، صورة ، أوراق فارغة ، أدوات كتابية الخطوات : ١- عليك أن تجد فيديو وصورة يوضحان الفكرة الكبرى التي تتناولها الوحدة الدراسية ۲- انسخ نصف الصورة فقط ، بحيث لا يستطيع الطلاب رؤية الصورة بإكمالها ٣- وزع الصورة واطلب إليهم لصقها في الدفاتر التفاعلية الخاصة بهم - اشرح لهم أنهم سيشاهدون الآن مقطع فيديو حول المفهوم ، وسوف يستخدمون المعلومات التي يجمعونها من المقطع لإكمال الصورة ، وتسمية المقطع ، وإضافة معلومات داعمة ٥- بعد مشاهدة المقطع ، أعطهم وقتا للرسم ، والتسمية ، وإضافة تفاصيل داعمة ٦ - اطلب إليهم العمل في أزواج أو مجموعات صغيرة لمقارنة صورهم المكتملة ودراسة أوجه التشابه والاختلاف. الملخص : من خلال إكمال نصف صورة ، يشارك الطلاب بنشاط في تعلمهم . عليهم تلخيص ما تعلموه ، عن طريق قيامهم بملء النصف الآخر من الصور وتدوين ملاحظات على المعلومات . يؤدى استخدام الدفاتر التفاعلية إلى تشجيع الطلاب على معالجة ما تعلموه وتقديمه بصريا إليك مثالا على الشكل الذي يبدو عليه الإدخال في دفتر الطلاب التفاعلي : مزيد من الأفكار : دع الطلاب يبحثون عن صور إضافية تدعم المفهوم قيد الدراسة ، وإضافة تلك الصور إلى دفاترهم اطلب إليهم فتح دفاترهم وتركها على مكاتبهم . أعط كل طالب ثلاث أوراق ملاحظات لاصقة ، واطلب إليهم تبادلها لترك تغذية مرتدة ايجابية و / أو طرح أسئلة على زملائهم عن طريق لصق الملاحظات اللاصقة على دفاترهم . يعتبر الدفتر “ مغلقا “ إذا كان يضم ثلاث ملاحظات لاصقة ، وبالتالي يحصل جميع الطلاب على تغذية مرتدة", "mode": ["فردي", "جماعي"], "thinking": ["تفكير نقدي", "استقصاء واكتشاف", "تواصل وحوار", "تذكر وفهم"], "tools": ["بطاقات", "صور", "فيديو", "أدوات صفية"]}, {"id": 69, "title": "إستراتيجية إكس - او", "content": "هيا بنا شفاهة هي", "mode": ["مرن"], "thinking": ["فهم وتطبيق"], "tools": ["لا تتطلب أداة محددة"]}, {"id": 70, "title": "إستراتيجية زوجية للطلاقة اللفظية ، تعمل على تنشيط التفكير . إنها تتيح للطلاب فرصة المشاركة", "content": "مع شريك ما تعلموه من درس ، بغض النظر عن شكل عرضه ، مثل : فيديو ، قراءة ، عرض ، نقاش ، وحتى أغنية . عندما يحين دور الطالب في الحديث ، تتمثل مشاركة شريكه في الاستماع بعناية ، بحيث لا يكرر أي شيء يقوله . يمكن أيضا أن تعمل هذه الإستراتيجية كتقييم لعملية التعلم ، حيث يتحقق المعلم – من - من مواطن قوة / ضعف فهم الطلاب للموضوعات خلالها المواد : مقطع فيديو ، مقطع للقراءة ، أو مصادر أخرى تتعلق بالمحتوى ، أوراق ، أداة للكتابة الخطوات : ١ - قسم الطلاب إلى مجموعات زوجية : الأول الطالب “ إكس “ ، والثاني الطالب “ أو ۲- اطلب من كل زوج رسم لوحة لعبة “ إكس – أو “ على ورقة فارغة -٣- اشرح للطلاب أن لديهم ٣ دقائق ونصفا ، إجمالا ، للتحدث مع الشركاء حول مل فهموه من الفيديو أو مقطع القراءة ، وان عليهم الاستماع بعناية حتى لا يكرروا ما يقوله الشخص الآخر ٤ - يبدأ الطالب \" إكس\" بالتحدث لمدة دقيقة حول ما تعلمه ، ثم يضع علامة “إكس “ في أي مكان على لوحة لعبة “ إكس – او “ . ٥- بعد ذلك يعبر الطالب “ او “ في دقيقة عما تعلمه من الفيديو . يجب ألا يكرر الطالب “ أو “ أي شيء قاله الطالب “ إكس “ ، ثم يضع علامة “ أو “ على لوحة اللعبة ٦ - كرر هذه العملية مرتين إضافيتين ، مع تقليص المدة الزمنية في كل مرة . وعلى سبيل المثال : * حدد ۳۰ ثانية للطالب “ إكس\" للمشاركة مرة أخرى فيما تعلمه من الفيديو ) دون تكرار التفاصيل ) ، ثم يفعل الطالب “ او “ الشيء نفسه وأخيرا ، حدد ١٥ ثانية للطالب “ إكس “ للحديث عن شيء تعلمه من الفيديو ، ثم ١٥ ثانية للطالب “ او “ لتلخيص الحديث عما تم تعلمه ۷- تأكد من أن الطلاب يدركون انه إذا كرر طالب ما سبق وقاله الآخر ، يصبح على شريكه أن يختار أين يضع علامتي \" إكس \" و \" او \" . يكمن الهدف في الفوز بلعبة “ إكس – او “ ضد شريك ، مع استكمال هذا النشاط .", "mode": ["ثنائي", "جماعي"], "thinking": ["تفكير نقدي", "تواصل وحوار"], "tools": ["فيديو", "أوراق/ملاحظات", "ألعاب", "تقنية/عرض"]}, {"id": 71, "title": "استراتيجية هذا", "content": "هو الملخص فكرة كبرى : عندما يقوم الطلاب بالتلخيص ، فهم \" يقتطعون الأمثلة المفرطة والدخيلة ، ويركزون على جوهر بجوهر المسالة ، في محاولة للعثور على الكلمات والعبارات الرئيسة التي تظل عندما تلفظ لاحقا - محتفظة ما قرءوه . أنهم يسعون إلى التقاط الأفكار الرئيسة والتفاصيل المهمة اللازمة لدعمهم “ . ومع ذلك ، عندما نطلب إليهم إجراء تلخيص ، فإنهم يميلون إلى كتابة كل شيء . بتركيز انتباه الطلاب على خمس كلمات أو عبارات رئيسة من مقتطفات وسائط إعلامية ، يمكننا مساعدتهم على تحديد أكثر ضيقا للمفاهيم المهمة ومن خلال المناقشات مع أقرانهم ، يتمكن الطلاب من تقديم أدلة على قراراتهم ، ومقارنة القوائم . المواد: مقطع فيديو ، أوراق بيضاء ، أدوات كتابية الخطوات : ١ - ابحث في موقع ديسكفرى اديوكيشن عن مقطع فيديو يشرح الموضوع أو المفهوم محل الدراسة ۲- اشرح للطلاب انه غير مسموح لهم بتدوين ملاحظات خلال مشاهدة الفيديو ، ولكن عليهم التركيز على الفكرة الرئيسة المطروحة . قم بتشغيل المقطع . ٣- اخبر الطلاب انك ستعيد تشغيل مقطع الفيديو ، وتسمح لهم بتدوين ملاحظات ، وان عليهم التركيز على كتابة العناصر التي تدعم الفكرة الكبرى التي يتناولها المقطع ٤ - بعد انتهاء مشاهدة المقطع ، امنح الطلاب دقيقة أو دقيقتين لكتابة خمس أفكار تتسم بالأهمية لفهم المقطع. بعد ذلك ، امنحهم ثلاث دقائق لمناقشة قوائمهم مع شريك . عليهم تعريف معنى كل كلمة في سياق الفيديو ، وتقديم أدلة حول : لماذا تعبر عن فكرة الفيديو الرئيسة ٦ - امنحهم دقيقتين إضافيتين لدمج القوائم في قائمة واحدة تضم ست أو سبع كلمات أو عبارات ۷ امنحهم دقيقتين إضافيتين لكتابة ملخص للفيديو في جملة واحدة - اطلب إليهم مشاركة ملخصاتهم مع الفصل الملخص : بتركيز انتباه الطلاب على خمس كلمات أو عبارات رئيسة ، يمكننا مساعدتهم على التركيز على المفاهيم المهمة . ومن خلال المناقشة مع أقرانهم ، يتمكن الطلاب من تقديم أدلة على قراراتهم . يجب أن تبدو عينات قوائم وملخصات الطلاب", "mode": ["جماعي"], "thinking": ["تفكير نقدي", "استقصاء واكتشاف", "تواصل وحوار"], "tools": ["فيديو", "أدوات صفية"]}, {"id": 72, "title": "إستراتيجية السكوت من ذهـ", "content": "الفكرة : تركز هذه الإستراتيجية انتباهنا على الصور ، فإذا كانت صورة تساوى ألف كلمة ، لك أن تتخيل قيمة الفيديو ، وبتوجيه انتباه الطلاب من الصوت إلى الصور وجعلهم يناقشون ما يرونه بصوت عال ، يكتسب المعلمون فكرة عما يفهمه الطلاب ، وما يحتاجون إلى إتقانه، وما يريدون معرفة المزيد عنه . المستلزمات : مقطع فيديو بصور كبيرة ، وأوراق ، وأدوات كتابية الخطوات : ۱ - اختر مقطع فيديو من الوحدة موضوع الدراسة ، واعرضه دون الصوت . يجب أن يحتوى المقطع على صور كبيرة ، وعلى محتوى مهم من الوحدة الدراسية ۲- اشرح الإستراتيجية للطلاب بإخبارهم أنهم سوف يشاهدون مقطع فيديو دون الاستماع إلى الصوت -- اطلب إليهم ، خلال مشاهدتهم للمقطع ، وصف ما يرونه ٤ - كرر إيقاف الفيديو كي تطرح أسئلة توجيهية ، أو لتجعل الطلاب يتوقعون ما سوف يحدث . يمكن أن يسجل الطلاب إجاباتهم على الورق ٥- عندما ينتهي المقطع ، اطلب إلى الطلاب أن يشرحوا لزملائهم ما أوضحه الفيديو الخلاصة : تعد هذه الإستراتيجية وسيلة رائعة لتركيز اهتمام طلابك على الصور ، وتقديم استدلالات ، والتنبؤ بمحتوى الوحدات الدراسية .", "mode": ["فردي"], "thinking": ["تفكير إبداعي", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "فيديو", "أدوات صفية", "تقنية/عرض"]}, {"id": 73, "title": "إستراتيجية المظروف لو سمحت", "content": "فكرة كبرى : يكمن غرض هذه الإستراتيجية في السماح للطلاب باستخدام المعرفة السابقة لعمل توقعات والاستفادة من المناقشة والتفكير لترسيخ فهمهم . تتجدر عملية التوقع في الفهم. ولعمل توقعات جيدة وقوية يجب أن يتحلى الطلاب بفهم راسخ للمحتوى قيد الدراسة ، ويمتلكوا القدرة على استدعاء المعلومات ، ومعرفة كيفية استخدام الخيوط المختلفة لتقديم استنتاجات ، وبناء روابط بين المصادر المختلفة للمعلومات المواد : فيديو يقدم مدخلا لموضوع ، مظاريف معدة ) مظروف لكل مجموعة ) ، دفتر ملاحظات لاصقة ، أدوات كتابية الخطوات : ١ - قسم الفصل إلى مجموعات من ٣ أو ٤ ٠ اختر كاتبا لكل مجموعة . قم بتزويد كل مجموعة بمظروف مختوم يضم ٣ - ٥ قرائن مفصلة مكتوبة عليه من الخارج ، وتوجيهات مكتوبة في داخله حول أين يمكنهم مشاهدة الفيديو ٢ - يناقش الطلاب القرائن في مجموعاتهم مع إعداد توقعات ، بينما يتولى الكاتب تدوين التوقعات على ورقة ملاحظات لاصقة ٣- بعد المناقشة ، قل : « المظروف لو سمحت ! » . هذا هو الرمز لكي يفتح اللاب المظاريف ويكتشفوا ما عليهم القيام به لتأكيد توقعاتهم ٤ - يشاهد الطلاب مقطع الفيديو الذي يعرض الموضوع الجديد يفكر الطلاب ويتناقشون في مجموعات صغيرة حول مدى دقة توقعاتهم، ويستمر الكاتب في تدوين نتائجهم على الجزء الخلفي من ورقة الملاحظات اللاصقة الملخص : تعتبر هذه الإستراتيجية طريقة فعالة كمدخل لوحدة جديدة أو موضوع دراسي جديد . وهى تشرك الطلاب بالسماح لهم بتقديم توقعات ، وتستخدم المناقشة والتفكير لترسيخ فهمهم", "mode": ["جماعي"], "thinking": ["تواصل وحوار"], "tools": ["فيديو", "أوراق/ملاحظات", "أدوات صفية", "تقنية/عرض"]}, {"id": 74, "title": "إستراتيجية صناعة الفيديوهات باستخدام شرائح (الورق", "content": "و الفكرة : تهدف هذه الإستراتيجية إلى مساعدة الطلاب في شرح الموضوعات بأسلوبهم الخاص وإظهار إبداعهم “ تختلف إعادة الصياغة عن الحفظ ؛ فهي تساعد على التفكير أكثر في المبادئ الأساسية والنظر إلى الصورة الكلية للأشياء عوضا عن الإجابة على أسئلة محددة عن نص أو موضوع ما . تساعد إعادة الصياغة الطلاب كذلك في وضع المبادئ والأفكار ، مثلما هي الحل في وضع المصطلحات وتأليف القصص . وكلما مارس الطلاب إعادة الصياغة ، زادت قدرتهم على الفهم والربط والاستنتاج . \" يشمل نشاط شرائح الورق تسلسلا مرئيا وشفهيا للعرض وإعادة صياغة لقصة أو موضوع . المستلزمات : مقاطع فيديو ومقالات عن موضوع الدرس ، وأوراق فارغة ( من ٨ إلى ١٠ ورقات لكل فريق ) ، وأقلام ، وأجهزة تسجيل رقمية الخطوات : ١ - اشرح الإستراتيجية للطلاب بطلب إعداد مشروع نهائي عن موضوع الدرس لتدريسه لغيرهم من الطلاب بإتباع خطوات العصف الذهني للتمكن من الموضوع ۲- اعرض على الطلاب فكرة عامة أو سؤالا مهما عن موضوع الدرس ، واطلب منهم العمل في فريق مكون من ثلاثة طلاب لاستكشاف مجموعة متنوعة من موارد و البحث عن معلومات لدعم الفكرة العامة أو لدعم إجاباتهم على السؤال المهم الذي تطرحه -- اطلب من الطلاب اختيار خمس معلومات من الموارد التي توصلوا إليها وإعداد شريحة من الورق بها صورة وشرح لكل معلومة . اطلب منهم كذلك إعداد شريحة افتتاحية ٤ - على الطلاب وضع الصور بالترتيب الأنسب في رأيهم وكتابة نص مصاحب لكل شريحة مع عدم كتابة النص على الشريحة -٥- يتدرب الطلاب على قراءة النصوص قبل تسجيلها ، وهو ما يساعد في تنمية مهارات القراءة بطلاقة . ٦- اطلب من كل طالب الجزء الذي كتبه عند عرض الشريحة ذات الصلة . ينبغي تصوير هذا الفيديو مرة واحدة دون توقف أو تحرير", "mode": ["فردي", "جماعي"], "thinking": ["تفكير إبداعي", "استقصاء واكتشاف", "تواصل وحوار", "تنظيم المعرفة", "تذكر وفهم"], "tools": ["صور", "فيديو", "أدوات صفية", "تقنية/عرض"]}, {"id": 75, "title": "إستراتيجية هل سمعت ذلك", "content": "فكرة كبرى : يمكن أن تأخذنا نوتة موسيقية واحدة من أغنية ما إلى زمن سابق ، ويمكن أن يؤدى صرير بيت مظلم إلى سرعة خفقان قلوبنا . على الرغم من أن الصوت يرتبط ارتباطا مباشرا بحاسة السمع ، فبإمكانه أيضا خلق صور ذهنية ذهنية . “ يتطلب بناء الصور الذهنية المزيد من الطاقة العقلية ، ولذا يؤدى إلى معالجة أعمق من إبداع تمثيل بالرسوم التخطيطية ، أو الرسم ، أو التصميم . عندما يبنى الطلاب صورا ذهنية ، عليهم حفظها في ذاكرتهم العاملة ، وفي الوقت نفسه يدرسونها ويتساءلون حولها ويستخلصون النتائج منها . أن الجهد المطلوب لتصور الصور الذهنية ومعالجتها يؤدى إلى بناء سجل معالج أكثر عمقا وأكثر دواما داخل المخ للمحتوى قيد الدراسة \" . المواد: مقطع صوتي ، أوراق ، أدوات كتابية الخطوات : ١- قم بتقديم هذه الإستراتيجية إلى الطلاب عن طريق تشغيل مقطعين صوتيين ( مثل صوت زجاج ينكسر وكلب ينبح ) . لا تكشف للطلاب عن المؤثرات الصوتية . يستجيب الطلاب بإغلاق عيونهم وتصور ما يسمعون . سلهم ماذا يرون ، وماذا يعرفون ، وما تساؤلاتهم عن الأصوات ؟ ۲- أعط الطلاب وقتا لكتابة قصة تضم المؤثرين الصوتيين -٣- عند الانتهاء من القصص ، اطلب إليهم تبادلها في مجموعات ثنائية ٤- اختر عددا قليلا من الطلاب لمشاركة الفصل كله في قصصهم ، مع تشغيل المؤثرات الصوتية في أثناء حديثهم الملخص : تعتبر هذه الإستراتيجية وسيلة فعالة ليستقى الطلاب نتائج حول الصور الذهنية ، ودراستها من خلال الكتابة السردية الوصفية.", "mode": ["فردي", "ثنائي", "جماعي"], "thinking": ["تفكير إبداعي", "تذكر وفهم"], "tools": ["صور", "أدوات صفية", "دمى/تمثيل"]}, {"id": 76, "title": "إستراتيجية نصف القصة", "content": ". فكرة كبرى : كم منا بذل جهدا من قبل ليبدأ محادثة مع الطلاب حول موضوع معين ؟ يقولون أن الصورة أعظم قيمة من ألف كلمة . إذا صح ذلك ، فلماذا لا نستخدم الصور كنقطة انطلاق للمناقشة ؟ سواء كنا نحاول أن نوضح للطلاب أننا بحاجة إلى رؤية الصورة الكاملة لتحديد رأى ، أو كنا نحاول تشجيع عقولهم للبدء في العمل وإقامة روابط بين الأشياء ، فان الصور تقدم طريقة سريعة وسهلة لبناء أساس للتعلم المواد: كمبيوتر ، بروجكتور متصل بالانترنت ، صورة ذات صلة الخطوات : ١- افتح أي صورة تتعلق بموضوع الدراسة ، واختر معاينة صورة كبيرة . قم بإجراء تكبير عند الزاوية اليمنى العليا ، بحيث يمكنك رؤية جزء فقط من الصورة ۲ - سل الطلبة ماذا يعتقدون أنهم سيدرسون اليوم . ٣- انتقل خلال الصورة إلى أسفل ، واعرض أقساما مختلفة منها ، وكرر السؤال ٤ - وأخيرا ، انتقل خلال الصورة نحو اليسار بحيث يتم عرض الصورة بأكملها ، وكرر السؤال . الملخص : تعتبر هذه الإستراتيجية طريقة شديدة الجاذبية لتقديم موضوع الدراسة للطلاب . فهي تساعدهم على التوقع ، فضلا عن النظر إلى الأمور من منظور جديد مزيد من الأفكار : · يمكنك أيضا أن تطلب إلى الطلاب كتابة توقعاتهم في دفتر قبل المناقشة مع الشركاء أو مع الفصل كله . بعد الكشف عن الصورة بأكملها ، يمكن أن يعود الطلاب إلى الدفتر ويضيفوا كيف كان توقعهم صحيحا أو غير صحيح ولماذا", "mode": ["فردي", "جماعي"], "thinking": ["تفكير إبداعي", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "أدوات صفية", "تقنية/عرض"]}, {"id": 77, "title": "إستراتيجية إدخال شكل فن", "content": "فكرة كبرى : أن هدف أي إستراتيجية تعليمية عالية المردود هو مساعدة الطلاب على معرفة أوجه التشابه والاختلاف . وان هذه الإستراتيجية \" تعزز ذكريات الطلاب عن طريق تركيز تفكيرهم على تحليل أزواج \"\" الأفكار، وتقوية قدرتهم على تذكر المحتوى الرئيس ، وتحسين الفهم بتسليط الضوء على تفاصيل مهمة يتمكن المعلمون ، باستخدام المصادر الرقمية ، من إعداد الملعب للطلاب الذين ربما لم تكن لديهم خبرات حياتية حقيقية يبنون منطقهم على أساسها المواد: صورتان متوافقتان مع أهداف المنهج الدراسي ، تخطيط فن كبير مع أداة كتابة ، أوراق ، قلم رصاص الطلاب الخطوات : -١ - اعرض الصورتين جنبا إلى جنب ٢- اطلب إلى الطلاب مقارنة الصورتين ، مع الاستشهاد بالأدلة لدعم ملاحظاتهم . على سبيل المثال : * اعتقد ، لأنني أرى ٣- قم بتسجيل استجابات الطلاب في شكل فن . عليك تذكير الطلاب بإيراد أدلة تدعم ملاحظاتهم ٤- وجههم إلى النظر عن كثب إلى الصور ، وذلك بطرح أسئلة توجيهية ، مثل : * ما اختلافات الإضاءة في الصورتين ؟ * كيف يؤثر اختلاف الإضاءة على رؤيتك للصورة ؟ * ما الحالة المزاجية التي كان فنان كل صورة يحاول التقاطها ؟ كيف تعرف ؟ هل الصور أكثر تشابها أم اختلافا ؟ لماذا تقول ذلك ؟ الملخص : إن النظر عن كثب إلى الصورة يوفر للطلاب فرصة لممارسة تحديد التفاصيل لإجراء نسخة احتياطية أو تبرير التصورات التي قدموها حول عمل شامل . كما يوفر للطلاب الذين يجدون تحليل النص أمرا عسيرا ، وسيلة أكثر ودا لممارسة التحليل وتقديم تغذية مرتدة حول الموضوع", "mode": ["فردي"], "thinking": ["تفكير نقدي", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "أدوات صفية", "خرائط/مخططات", "تقنية/عرض"]}, {"id": 78, "title": "إستراتيجية القصيدة الملموسة", "content": "الفكرة : تستخدم القصائد المرسومة في الفصول الدراسية منذ سنوات، وتضيف هذه الإستراتيجية تحولا على المفهوم باستخدامه كإستراتيجية تعليمية ، لحث الطلاب على التفكير والمشاركة في شيء تعلموه من خلال وسيط إعلامي المستلزمات : أوراق ، وأقلام تعلم ملونة ، ومقطع فيديو أو فقرة للقراءة الخطوات : ۱ - اشرح للطلاب أنهم سيبدعون قصيدة مرسومة، باستخدام المعلومات التي تعلموها من المقطع الإعلامي ۲ - شارك مع الطلاب مقطع فيديو ، وقل لهم انك ستطلب إليهم تذكر اكبر قدر ممكن من المعلومات عن محتوى مقطع الفيديو ٣- بعد عرض الفيديو ، اطلب إليهم رسم الخطوط العريضة لصورة أو مجموعة من الصور ، تمثل المفهوم الرئيسي لمقطع الفيديو · . 4 - يكتب الطلاب ، في الخطوط العريضة لكل شكل ، الحقائق التي تعلموها من مشاهدة الفيديو ه - دعهم ، بعد الانتهاء من عملهم ، يتبادلون صورهم في مجموعات صغيرة -٦- اعرض صور الطلاب في الفصل ، لعمل لوحة جدارية مصغرة من قصائد مرسومة عن موضوع او مفهوم محدد الخلاصة : تعد هذه الإستراتيجية وسيلة جذابة للطلاب للتعبير عن فهمهم ، واستخدام الفنون ، والتعرف على القصائد المرسومة", "mode": ["فردي", "جماعي"], "thinking": ["تفكير إبداعي", "تذكر وفهم"], "tools": ["صور", "فيديو", "أدوات صفية", "تقنية/عرض"]}, {"id": 79, "title": "إستراتيجية ماذا قالوا", "content": "فكرة كبرى : إذا سالت أي طالب عما يلزم لتحقيق نجاح في الدراسات الاجتماعية ، فمن المرجح أن يقول : الذاكرة الجيدة . لا يوافق المؤرخون على ذلك . فالأمر أكبر من ذلك بكثير . \" التاريخ ، بالنسبة للمؤرخين ، هو حجة حول ما يجب أن تعنيه أو لا تعنيه الحقائق . وحتى عندما يتمكن المؤرخون من تجميع أجزاء القصة الأساسية لما حدث ، فأنهم نادر ما يتفقون حول ما يعنيه الحدث أو : ما أسباب حدوثه \" . كيف يمكننا أن نساعد على تغيير منظورات الطلاب يمكننا ذلك عن طريق وضعها في صورة المواد : صورة ، أدوات كتابية الخطوات : ١ - اختر صورة تتوافق مع الوحدة الدراسية وتضم - كحد أدنى - شخصيتين أو حيوانين ۲- ضع داخل الصورة فقاعات الكلام ، عن طريق الرسم أو استخدام الملاحظات اللاصقة - اعرض الصورة على الطلاب ، ودعهم يتشاركون فيما يرون ، ويعرفون ، ويتساءلون حول المشهد ٤ - اشرح لهم أن عليهم استنتاج ما قالته الشخصيات لبعضها ، أو في عقولها ، حول ما حدث ٥- امنح الطلاب وقتا للكتابة في فقاعات الكلام ٦- دع الطلاب يتشاركون أعمالهم في مجموعات صغيرة تبحث عن أوجه التشابه والاختلاف بين الحوارات تختار كل مجموعة ما تشعر انه أفضل تمثيل للحوار وتشاركه مع الفصل كله ٧- بعد التصنيف ، اطلب مشاركة الفصل كله الملخص : تتطلب هذه الإستراتيجية أن يظهر الطلاب فهمهم للمحتوى باستخدام فقاعات الكلام لإعطاء سياق للصورة . يجب أن يستخدم الطلاب الأدلة الداعمة من الوحدة الدراسية للخروج باستنتاجات", "mode": ["فردي", "جماعي"], "thinking": ["تفكير إبداعي", "استقصاء واكتشاف", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "أدوات صفية", "دمى/تمثيل", "تقنية/عرض"]}, {"id": 80, "title": "إستراتيجية منظورات متعددة", "content": "فكرة كبرى : تستخدم هذه الإستراتيجية الصور لاشتراك الطلاب في منظورات متعددة لموضوع محدد ، بطريقة تسهم في أنماط تعلمهم المتفردة إن نظرية الذكاء المتعدد أصبحت تستخدم في الفصول الدراسية في أنحاء العلم كافة كوسيلة لتمييز التدريس وتستجيب لمواطن القوة لدى الطلاب واهتماماتهم . بدراسة تفاصيل صورة أو مقطع فيديو عن كثب ، يمكن أن يغوص الطلاب في موضوع ويعبروا عن الفهم وفقا لنمط تعلمهم المتفرد . المواد : صورة أو فيديو حول الموضوع ، أوراق ، أدوات كتابية الخطوات : ۱ - اختر صورة أو فيديو من الأفضل أن تضم الصورة أو الفيديو العديد من المكونات ، حيث يتولى الطلاب مسئولية استخراج العديد من التفاصيل والمنظورات المختلفة ۲- دع الطلاب يدرسون الصورة من خلال منظور شيء أو شخص ممثل فيها ٣- اطلب إليهم كتابة سرد قصصي يشرح ما يرونه ، يسمعونه ، يقولونه ، و / أو يختبرونه من هذا المنظور - اسمح للطلاب بمشاركة قصصهم مع أشخاص آخرين كتبوا من المنظور نفسه و / أو من منظورات مختلفة ، لمقارنة التفاصيل الملخص : يتعرض الطلاب ، في عصر المعلومات ، إلى هجمة من الصور ، وأفلام الفيديو ، والبيانات . ومن السهل أن تضيع التفاصيل وسط الصورة الكبيرة . بالتركيز على منظورات متعددة ، سيتمكن الطلاب من فحص وشرح تفاصيل محددة فيما يتعلق بالصورة الكبيرة .", "mode": ["فردي"], "thinking": ["تفكير نقدي", "تذكر وفهم"], "tools": ["صور", "فيديو", "أدوات صفية", "تقنية/عرض"]}, {"id": 81, "title": "إستراتيجية من", "content": "أنت فكرة كبرى : إذا كنا نريد أن يركز الطلاب على التعلم ، فعلينا أولا التأكد من أنهم يشعرون بالسلامة والأمان . قبل أن يوجه الطلاب انتباههم إلى التعلم المعرفي ( المناهج الدراسية ) ، يجب أن يشعروا بالسلامة بدنيا والأمان عاطفيا يعد استخدام قوة الصور لفهم وتحديد المشاعر تجاه بيئة التعلم بمثابة إستراتيجية فعالة تضمن أن يطور الطلاب علاقة ايجابية مع المعلم والمنهج الدراسي المواد: صورة ، أوراق ، قلم رصاص . الخطوات : ۱ - اختر صورة تضم فردين أو حيوانين أو شيئين يمثلان منظورين مختلفين (مثل : سمكة القرش وأسد البحر أو إعصار ومنزل ) . ۲ - قم بتقديم الموضوع أو المفهوم الرئيسي الذي سوف تقوم بتدريسه للطلاب ، -٣- اعرض الصورة واطلب إليهم مقارنة مشاعرهم تجاه احد الحيوانات ، أو الأشخاص ، أو البنود داخل الصورة. على سبيل المثال ، إذا كانت الصورة لتمساح وضفدع ، فقط يقول الطالب انه يشعر بأنه معلق وكأنه الضفدع ٤ - اطلب إليهم الكتابة عن : « من / ما » ، يضعون أنفسهم مكانه ، ولماذا ، وان يحددوا خطوة واحدة يمكن اتخاذها لتحقيق تقدم اطلب إليهم وضع خطة عمل تستند إلى إجاباتهم 6 - اجتمع معهم لاستعراض الإجابات وتناول أي شواغل أو مخاوف أو مفاهيم خطا حول هذا الموضوع . الملخص : يتمكن الطلاب باستخدام الصور ، من إجراء مقارنات وتعرف مشاعرهم. تتيح لهم هذه العملية وضع خطة عمل ، وتوفر فرصا للمعلمين لمناقشة سبل النجاح . مزيد من الأفكار : - دع الطلاب يستكشفون وحدة الدراسة عن طريق نزهة دائرية حولصور الموضوع . دعهم يعثرون على صور لتمثيل مشاعرهم حول الموضوع", "mode": ["فردي"], "thinking": ["تفكير نقدي", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "أدوات صفية", "دمى/تمثيل", "تقنية/عرض"]}, {"id": 82, "title": "استراتيجية ٢٥ شيئا لا تعرفها", "content": "فكرة كبرى : افتح أي مجلة ترفيهية وستجد حتما صفحة تضم « ٢٥ شيئا لا تعرفها » حول بعض المشاهير . وغالبا ما تكشف هذه الصفحات عن حقائق مثيرة للدهشة ، وتعطيك فكرة أفضل عنهم كأشخاص . في عالم يحيط الطلاب دوما بأنواع مختلفة من المعلومات ، يجب على المتعلم في القرن الحادي والعشرين أن يكون قادرا على تنقية المعلومات . يكمن غرض هذه الإستراتيجية في أن يتمكن الطلاب من اختيار وتقاسم أهم التفاصيل في الفكرة الكبرى بالوحدة الدراسية المواد: قطع كبيرة من الورق ، أقلام تعليم ، مجموعة من الوسائط الإعلامية ذات صلة بموضوع منهجك الدراسي الحالي الخطوات : الدراسة 1 - اشرح للطلاب أنهم سيقومون بإعداد _ والتعاون في _ قائمة « ٢٥ شيئا لا تعرفها » حول الوحدة قيد . يجب أن تؤكد لهم أن القائمة التي سيتولون إعدادها يجب أن تتضمن حقائق تعتبر بمثابة معلومات جديدة ، وليس المعلومات التي يعرفونها بالفعل ۲- قسم الطلاب إلى خمس مجموعات . حدد لكل مجموعة موضوعا يتصل بالوحدة الدراسية وفر للمجموعات سلسلة من الصور ، وأفلام الفيديو ، والمقالات ، حول موضوعاتهم . تتولى كل مجموعة ، باستخدام المصادر المخصصة لها ، وضع قائمة من « ٥ أشياء لا تعرفها » حول الموضوع المعين لها . ولإعداد القوائم ، يمكن أن يستخدم الطلاب أفرخا كبيرة من الورق وأقلاما لوضع علامات. ٤- عندما تنتهي المجموعات من أعداد القوائم ، اطلب إلى كل مجموعة مشاركة الحقائق الخمس . ثم اطلب إلى المجموعات تقديم أدلة حول أسباب أهمية معرفة الحقائق التي اختاروها - قم بضم قوائم المجموعات ، حيث تضم كل قائمة « ٥ أشياء لا تعرفها » ، لإعداد قائمة تعاونية تشمل « ٢٥ شيئا لا تعرفها » . الملخص : تعتبر هذه الإستراتيجية وسيلة رائعة يستكشف الطلاب من خلالها المصادر وينتقون أهم المعلومات", "mode": ["فردي", "جماعي"], "thinking": ["تذكر وفهم"], "tools": ["صور", "فيديو", "أدوات صفية"]}, {"id": 83, "title": "إستراتيجية عشرون سؤالا", "content": "فكرة كبرى : لعبة جي المنطقي ۲۰ سؤال معروفة على نطاق واسع، وتساعد على تشجيع التساؤل والتفكير الاستنتاـ لعملية التساؤل تأثير فسيولوجي بالفعل على المخ البشرى . تقوم الخلايا العصبية بمزيد من الروابط بسبب حاجة الجسم للتعامل مع سؤال » . إن خلق ثقافة التساؤل داخل الفصل يساعد على تحسين حل المشكلات ، وتنمية الثقة بالنفس ، وتعزيز التعلم الفردي . تنبني هذه الإستراتيجية على اللعبة التقليدية كوسيلة لتشجيع الطلاب على التفكير حول وحدة أو موضوع الدراسة وصياغة أسئلة بشأنها . المواد : حوالي ۱۰ صور مطبوعة مسبقا ، أدوات كتابية لكل طالب الخطوات : 1- قم بطبع صور تتصل بالموضوع وعلقها في أنحاء الفصل ، ضع سؤالا استعلاميا أعلى رتبة بحيث يحفز الطلاب على طرح المزيد من الأسئلة خلال محاولتهم الإجابة عن السؤال المطروح و / أو تحديد موضوع الدراسة العام ۲- اشرح للطلاب أنهم سيشاهدون بعض الصور المعلقة في الفصل وترتبط جميعها بفكرة اكبر ، وأن الصور هي مجرد لقطة . ٣- دعهم يتحركون داخل الغرفة ، ويتوقفون لدقيقة أمام كل صورة للتفكير في الأسئلة التي قد توجد لديهم حول سؤال الصورة الأكبر الذي وجهته إليهم - استمر حتى تتاح لجميع الطلاب فرصة تحليل كل صورة اجعل الطلاب مجموعة ، ودعهم يتشاركون الأسئلة التي أعدوها . -- قم بطبع أو تعليق أسئلة الطلاب الجماعية في جميع أنحاء الفصل ، بحيث يتمكن فصلك من الرجوع إلى الأفكار طوال دراسة الوحدة الملخص : · تعتبر هذه الإستراتيجية وسيلة فعالة لتشجيع الطلاب على التساؤل ، وذلك بتعزيز عمليات التساؤل والتفكير الاستنتاجى المنطقي في الفصل للتعرف على المزيد من الاستراتيجيات يمكن الحصول عليها من بنك المعرفة من خلال الرابط التالي http://0610uj0cy.1103.y.http.discoveryeducation.ekb.eg.mplbci.ekb.eg/comm unity-den/spotlight-on-strategies/ أتمنى أن يكون المحتوى أفادكم والاستعانة به في التغيير الفعلي للعملية التعليمية والارتقاء بها مع تحياتي أ/ رحاب عبد الرحمن الجنزوري مدرسة حاسب آلي بمدرسة أحمد عرابي ث بنات إدارة العمرانية التعليمية بمحافظة الجيزة", "mode": ["فردي", "جماعي"], "thinking": ["حل المشكلات", "تواصل وحوار", "تذكر وفهم"], "tools": ["صور", "ألعاب", "أدوات صفية", "تقنية/عرض"]}];const $=id=>document.getElementById(id);const norm=s=>(s||'').toLowerCase().replace(/[إأآ]/g,'ا').replace(/ى/g,'ي');function allTags(r){return [...r.mode,...r.thinking,...r.tools]}function render(){const q=norm($('q').value),m=$('mode').value,t=$('thinking').value,u=$('tool').value;const rows=DATA.filter(r=>{const hay=norm(r.title+' '+r.content);return(!q||hay.includes(q))&&(!m||r.mode.includes(m))&&(!t||r.thinking.includes(t))&&(!u||r.tools.includes(u))});$('count').textContent=`عرض ${rows.length} من ${DATA.length} استراتيجية`;$('grid').innerHTML=rows.length?rows.map(r=>`<article class="card" data-id="${r.id}"><div class="num">#${r.id}</div><h2>${r.title}</h2><div class="excerpt">${r.content}</div><div class="chips">${allTags(r).slice(0,6).map(x=>`<span class="chip">${x}</span>`).join('')}</div></article>`).join(''):'<div class="empty">لا توجد نتائج بهذه الفلاتر.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(+c.dataset.id))}function open(id){const r=DATA.find(x=>x.id===id);$('detail').innerHTML=`<div class="num">استراتيجية رقم ${r.id}</div><h2>${r.title}</h2><div class="chips">${allTags(r).map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="section detail">${r.content}</div>`;$('modal').classList.add('open')}['q','mode','thinking','tool'].forEach(id=>$(id).addEventListener('input',render));$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('open')};render();</script></body></html>
